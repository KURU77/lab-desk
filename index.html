<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究デスク — 進行中の研究と部品をまとめて管理</title>
<meta name="description" content="進行中の研究の概要・先行研究・費用と備品・進捗・予定を一か所で管理し、手持ちの電子部品や工具の在庫も記録できるアプリ。">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="研究デスク">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ============================================================
   研究デスク — 研究の全体像と、手持ちの部品・工具の台帳
   色は :root のトークンだけで定義し、light / dark / OS依存 の
   3状態すべてで解決するようにしてある。
   ============================================================ */
:root{
  --bg:#EDEFEA; --grid:rgba(40,70,55,.055);
  --card:#FBFCFA; --card-2:#F2F4EF; --sunken:#E4E7E0;
  --ink:#161A17; --muted:#5F6862; --faint:#879089;
  --line:#D2D8D0; --line-soft:#E1E5DE;
  --acc:#B4531F; --acc-ink:#A04818; --acc-soft:#F5E4D8; --on-acc:#FFFFFF;
  --pcb:#2D6A4E; --pcb-soft:#DAEADF;
  --warn:#94620A; --warn-soft:#F4E9CF;
  --bad:#B3261E; --bad-soft:#F6DFDC;
  --blue:#2F5B8A; --blue-soft:#DDE7F2;
  --shadow:0 1px 2px rgba(20,26,22,.05), 0 6px 18px rgba(20,26,22,.06);
  --shadow-lift:0 2px 6px rgba(20,26,22,.08), 0 18px 44px rgba(20,26,22,.16);
  --scrim:rgba(16,20,18,.45);
  --f-body:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
  --navh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --grid:rgba(120,190,150,.045);
    --card:#171C19; --card-2:#1D231F; --sunken:#121714;
    --ink:#E4E9E5; --muted:#98A39C; --faint:#76817A;
    --line:#29312C; --line-soft:#212823;
    --acc:#E08A55; --acc-ink:#F0A472; --acc-soft:#3A2417; --on-acc:#1A0F08;
    --pcb:#72C398; --pcb-soft:#15291E;
    --warn:#DDA947; --warn-soft:#33280E;
    --bad:#F08077; --bad-soft:#3A1B19;
    --blue:#86B2E0; --blue-soft:#172536;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --grid:rgba(120,190,150,.045);
  --card:#171C19; --card-2:#1D231F; --sunken:#121714;
  --ink:#E4E9E5; --muted:#98A39C; --faint:#76817A;
  --line:#29312C; --line-soft:#212823;
  --acc:#E08A55; --acc-ink:#F0A472; --acc-soft:#3A2417; --on-acc:#1A0F08;
  --pcb:#72C398; --pcb-soft:#15291E;
  --warn:#DDA947; --warn-soft:#33280E;
  --bad:#F08077; --bad-soft:#3A1B19;
  --blue:#86B2E0; --blue-soft:#172536;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overscroll-behavior-x:none}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; background-attachment:fixed;
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
body{overflow-x:hidden;overscroll-behavior-x:none}
/* iOS は body の overflow:hidden だけでは背景が動くので、開いている間は位置ごと固定する */
body.lock{overflow:hidden;position:fixed;left:0;right:0;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--acc-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-feature-settings:"zero" 1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
[hidden]{display:none!important}

/* ---------- 骨組み ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em;font-size:17px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand i::after{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--on-acc)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
main{padding:16px 0 calc(var(--navh) + env(safe-area-inset-bottom) + 90px)}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);padding:0 4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--acc-ink)}

/* ---------- 部品 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sec .sp{flex:1}
.sec .lnk{font-size:13px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.fab{position:fixed;z-index:25;right:max(16px, calc(50% - 380px + 16px));bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--acc);color:var(--on-acc);
  display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:var(--shadow-lift)}
.fab svg{width:22px;height:22px}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;
  background:var(--sunken);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.st-進行中{background:var(--pcb-soft);color:var(--pcb)}
.st-計画中{background:var(--blue-soft);color:var(--blue)}
.st-中断{background:var(--warn-soft);color:var(--warn)}
.st-完了{background:var(--sunken);color:var(--muted)}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--pcb-soft);color:var(--pcb)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on b{color:inherit;opacity:.7}

.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.done i{background:var(--pcb)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:12px 12px 10px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3;white-space:nowrap}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }

.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .big{font-size:16px;color:var(--ink);font-weight:700;margin-bottom:6px}
.empty .btnrow{justify-content:center;margin-top:16px}

/* 研究カード */
.plist{display:grid;gap:10px}
.proj{display:block;color:inherit;padding:14px 16px 13px;position:relative;overflow:hidden}
.proj:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.proj .hd{display:flex;align-items:flex-start;gap:10px}
.proj h3{margin:0;font-size:16px;line-height:1.45;flex:1;min-width:0}
.proj .sum{margin:6px 0 10px;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proj .pr{display:flex;align-items:center;gap:10px}
.proj .pr .bar{flex:1}
.proj .pr .n{font-family:var(--f-mono);font-size:12.5px;font-weight:600;min-width:38px;text-align:right}
.proj .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.proj .meta span{display:inline-flex;align-items:center;gap:5px}
.proj .meta svg{width:14px;height:14px;opacity:.8}
.proj .meta .next{color:var(--ink)}

/* 行リスト */
.rows{padding:2px 0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);color:inherit;min-height:52px}
.row:first-child{border-top:0}
button.row{width:100%;text-align:left}
.row:where(a,button):hover{background:var(--card-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.row .amt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.row .date{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;width:74px;flex:none}
.row.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}

.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.chk svg{width:15px;height:15px;opacity:0;color:var(--on-acc)}
.chk.on{background:var(--pcb);border-color:var(--pcb)}
.chk.on svg{opacity:1;color:var(--card)}

.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.due.over{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}

/* 研究詳細 */
.phead{padding:16px 16px 14px}
.phead .st{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.phead h2{margin:0 0 4px;font-size:20px;line-height:1.4}
.phead .pr{display:flex;align-items:center;gap:12px;margin-top:12px}
.phead .pr .bar{flex:1;height:8px;border-radius:4px}
.phead .pr .n{font-family:var(--f-mono);font-weight:600;font-size:15px}
.seg{display:flex;gap:2px;background:var(--sunken);border-radius:11px;padding:3px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
@media (max-width:420px){ .seg a{padding:7px 7px;font-size:12.5px} .seg a b{margin-left:1px} }
.seg a{flex:1 0 auto;text-align:center;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg a b{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:500;margin-left:3px}

.dl{display:grid;gap:0}
.dl > div{padding:12px 16px;border-top:1px solid var(--line-soft)}
.dl > div:first-child{border-top:0}
.dl dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl dd.none{color:var(--faint)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}

.ref .t{font-weight:600}
.ref .s i{font-style:normal;color:var(--ink)}
.ref .note{margin-top:5px;font-size:13px;padding-left:10px;border-left:2px solid var(--acc-soft);color:var(--muted);white-space:pre-wrap}
.ref .links{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:12.5px;overflow-wrap:anywhere}
.ref .links a{white-space:nowrap}

.total{display:flex;align-items:baseline;gap:10px;padding:16px}
.total .v{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:-.02em}
.catbars{padding:0 16px 14px;display:grid;gap:7px}
.catbar{display:grid;grid-template-columns:96px 1fr 84px;align-items:center;gap:10px;font-size:12.5px}
.catbar .bar{height:8px}
.catbar .amt{font-family:var(--f-mono);text-align:right}

.ring{display:flex;align-items:center;gap:18px;padding:16px}
.ring svg{width:92px;height:92px;flex:none}
.ring .lbl{font-size:13px;color:var(--muted)}
.ring .big{font-family:var(--f-mono);font-size:30px;font-weight:600}
.range{width:100%;accent-color:var(--acc)}
.logadd{padding:12px 16px;display:grid;gap:8px}
.logadd textarea{min-height:70px}
.tl{padding:6px 16px 10px}
.tl .it{position:relative;padding:8px 0 10px 20px;border-left:2px solid var(--line-soft);margin-left:5px}
.tl .it::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl .it .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tl .it .x{white-space:pre-wrap;overflow-wrap:anywhere}
.tl .it button{position:absolute;right:0;top:6px;color:var(--faint);font-size:12px}

/* 在庫 */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 38px;font-size:15px}
.search svg{position:absolute;left:12px;top:11px;width:19px;height:19px;color:var(--faint)}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--acc);width:16px;height:16px}
.grp{margin-top:14px}
.grp h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 6px;display:flex;gap:8px;align-items:baseline;letter-spacing:.04em}
.grp h3 b{font-family:var(--f-mono);font-weight:500;color:var(--faint)}
.inv .t small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-soft)}
.qty button:hover{background:var(--sunken);color:var(--ink)}
.qty button svg{width:14px;height:14px}
.qty .n{min-width:44px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:14px;line-height:1.1}
.qty .n small{display:block;font-family:var(--f-body);font-size:10px;color:var(--faint);font-weight:500}
.qty .n.low{color:var(--bad)}

/* 設計図 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.dcard{display:flex;flex-direction:column;text-align:left;overflow:hidden;color:inherit;padding:0}
.dcard:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.dcard .th{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line-soft);display:grid;place-items:center;overflow:hidden;width:100%}
.dcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.dcard .th .ph{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--bad);display:grid;place-items:center;width:100%;height:100%;background:var(--card-2)}
.dcard .bd{padding:9px 11px 11px;display:grid;gap:3px;min-width:0}
.dcard .t{font-weight:600;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .s .pill{height:19px;font-size:10.5px;padding:0 6px;margin-right:4px}
.dview{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;display:grid;place-items:center;min-height:120px}
.dview img{max-width:100%;max-height:58vh;display:block}
.dview.pdf{cursor:default;padding:26px;background:var(--card-2);gap:10px;text-align:center}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 12px;font-size:12.5px;color:var(--muted)}
.dnote{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;font-size:14px}
.preview{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;display:grid;place-items:center;max-height:200px;overflow:hidden}
.preview img{max-width:100%;max-height:200px;display:block}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.addrow .btn{height:46px}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);overflow:auto;display:grid;place-items:center}
.lightbox img{max-width:100vw;max-height:100vh;display:block;cursor:zoom-in;background:#fff}
.lightbox.zoom{place-items:start}
.lightbox.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.lightbox .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;font-size:20px;z-index:2}

.sketch{position:fixed;inset:0;z-index:65;background:var(--sunken);display:flex;flex-direction:column}
.skbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.skbar.top{padding-top:calc(env(safe-area-inset-top) + 8px)}
.skbar.bottom{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom) + 8px);overflow-x:auto;scrollbar-width:none}
.skbar.bottom::-webkit-scrollbar{display:none}
.skbar .sp{flex:1}
.skbar .ttl{font-weight:700;font-size:14px}
.skt{height:38px;min-width:38px;padding:0 9px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);font-size:12.5px;font-weight:500;flex:none;border:1px solid transparent}
.skt svg{width:20px;height:20px}
.skt.on{background:var(--acc-soft);color:var(--acc-ink);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.skt:disabled{opacity:.35}
.skdiv{width:1px;height:24px;background:var(--line);flex:none;margin:0 3px}
.sw{width:28px;height:28px;border-radius:50%;flex:none;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.wd{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;flex:none}
.wd i{display:block;border-radius:50%;background:var(--ink)}
.wd.on{background:var(--sunken);outline:1px solid var(--line)}
.skstage{flex:1;min-height:0;display:grid;place-items:center;padding:12px;overflow:hidden}
.skwrap{position:relative;box-shadow:var(--shadow-lift);background:#fff}
.skwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#skPrev{touch-action:none;cursor:crosshair}

/* iOS Safari は 16px 未満の入力欄にフォーカスすると画面を拡大するので、入力欄はすべて 16px 以上 */
input,select,textarea{font-size:16px!important}
/* 入力欄を列の幅に収める（iOS の日付欄は幅指定を無視して列からはみ出し、シートが横に動く原因になる） */
.form,.fld,.panel{min-width:0;max-width:100%}
.fld input,.fld select,.fld textarea{min-width:0;max-width:100%;display:block}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.paste textarea{font-size:15px}

/* 同期ボタン */
.iconbtn.sync{margin-right:-8px}
.iconbtn.sync .ok,.iconbtn.sync .bang{display:none}
.iconbtn.sync.ok .ok{display:inline;color:var(--pcb)}
.iconbtn.sync.ok{color:var(--pcb)}
.iconbtn.sync.syncing{color:var(--acc-ink);animation:pulse 1.2s ease-in-out infinite}
.iconbtn.sync.login,.iconbtn.sync.error{color:var(--bad)}
.iconbtn.sync.login .bang,.iconbtn.sync.error .bang{display:inline}
.iconbtn.sync.offline{color:var(--faint)}
@keyframes pulse{50%{opacity:.35}}

/* 自動計算された金額の欄 */
.fld input[readonly]{background:var(--sunken);font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.fld small.calc{color:var(--muted);font-family:var(--f-mono)}

/* 使用済み */
.qty .n.used{color:var(--muted);min-width:56px}
.usedtag{color:var(--muted)}
.userow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line-soft);min-height:56px}
.userow:first-child{border-top:0}
.userow > button.main{flex:1;min-width:0;text-align:left}
.userow.isused .t{color:var(--muted)}
.usebtn{flex:none;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--ink);white-space:nowrap}
.usebtn svg{width:14px;height:14px}
.usebtn:hover{background:var(--card-2)}
.usebtn.on{background:var(--pcb-soft);border-color:transparent;color:var(--pcb)}

/* シート */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{touch-action:pan-y pinch-zoom;overscroll-behavior:contain}
.sheet .panel{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-x:hidden;overflow-y:auto;touch-action:pan-y pinch-zoom;background:var(--card);
  border-radius:18px 18px 0 0;box-shadow:var(--shadow-lift);transform:translateY(24px);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none;opacity:1}
@media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:18px;max-height:86vh;padding-bottom:18px} }
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.panel h2{font-size:17px;margin:0 0 14px}
.form{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld.third{flex:1 1 calc(33% - 8px)}
.fld > span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fld small{font-size:11.5px;color:var(--faint)}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.logadd textarea,.logadd input{
  width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:9px 11px;font-size:15px;min-height:42px}
.fld textarea,.logadd textarea{resize:vertical;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus,.logadd textarea:focus,.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld.check{flex-direction:row;align-items:center;gap:9px}
.fld.check input{width:18px;height:18px;accent-color:var(--acc)}
.fld.check > span{font-size:14px;font-weight:500;color:var(--ink);letter-spacing:0}
.formbtns{display:flex;gap:8px;margin-top:18px;align-items:center}
.formbtns .sp{flex:1}
.paste{background:var(--sunken);border-radius:11px;padding:12px;margin-bottom:14px;display:grid;gap:8px}
.paste textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;font-size:13px;font-family:var(--f-mono);min-height:62px;resize:vertical}
.paste .hint{font-size:12px;color:var(--muted)}
.infobox{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
.infobox b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.pick{max-height:50vh;overflow:auto;border:1px solid var(--line-soft);border-radius:10px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.setrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line-soft)}
.setrow:first-child{border-top:0}
.setrow .main{flex:1}
.setrow .s{font-size:12.5px;color:var(--muted)}
.setrow select{border:1px solid var(--line);background:var(--card-2);border-radius:8px;padding:6px 8px}
</style>
</head>

<script>
'use strict';
/* ============================================================
   データ
   ============================================================ */
var KEY = 'lab-desk-v1';
var STATUSES = ['進行中','計画中','中断','完了'];
var EXP_CATS = ['電子部品','工具・計測器','材料・消耗品','書籍・文献','ソフト・サービス','交通・発送','その他'];
var INV_CATS = ['マイコン・ボード','センサ','表示・LED','モーター・駆動','電源・電池','受動部品','半導体・IC','通信モジュール','コネクタ・配線','基板・ブレッドボード','工具','計測器','材料・消耗品','その他'];
var REF_STATUS = ['未読','読んだ','精読済み','引用予定'];
var DS_STATUS = ['これから取得','取得済み','使用中','使用終了'];
var D_KINDS = ['設計図','回路図','配線図','ブロック図','スケッチ','完成イメージ','写真','資料'];

var DB = load();
var UI = { invView:'すべて', dProj:'すべて', dKind:'すべて', projFilter:'すべて', invQuery:'', invCat:'すべて', invLow:false, lastRoute:'' };

function blank(){ return { v:1, projects:[], inventory:[], designs:[], deleted:{}, settings:{ theme:'auto' } }; }
function load(){
  try{
    var d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.v) return normalize(d);
  }catch(e){}
  return blank();
}
function normalize(d){
  d.projects = Array.isArray(d.projects) ? d.projects : [];
  d.inventory = Array.isArray(d.inventory) ? d.inventory : [];
  d.settings = d.settings || { theme:'auto' };
  d.projects.forEach(function(p){
    ['refs','datasets','expenses','uses','milestones','logs','tags'].forEach(function(k){ if(!Array.isArray(p[k])) p[k] = []; });
    if(!p.status) p.status = '計画中';
    if(!p.progressMode) p.progressMode = 'auto';
  });
  d.inventory.forEach(function(it){ if(!Array.isArray(it.tags)) it.tags = []; });
  d.designs = Array.isArray(d.designs) ? d.designs : [];
  d.deleted = d.deleted && typeof d.deleted === 'object' && !Array.isArray(d.deleted) ? d.deleted : {};
  d.designs.forEach(function(x){ if(!Array.isArray(x.tags)) x.tags = []; });
  delete d.files;
  return d;
}
function save(){
  stampChanges();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存できませんでした（ストレージの空きを確認してください）'); }
  if(typeof syncSoon === 'function') syncSoon();
}

/* ============================================================
   小道具
   ============================================================ */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function yen(n){ return '¥' + Math.round(+n || 0).toLocaleString('ja-JP'); }
function num(n){ return (+n || 0).toLocaleString('ja-JP'); }
function fmtDate(iso){ if(!iso) return ''; var a = iso.split('-'); return a[0] + '/' + (+a[1]) + '/' + (+a[2]); }
function fmtShort(iso){ if(!iso) return ''; var a = iso.split('-'); return (+a[1]) + '/' + (+a[2]); }
function daysUntil(iso){ return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5); }
function dueLabel(iso){
  if(!iso) return { t:'期限なし', c:'' };
  var n = daysUntil(iso);
  if(n < 0) return { t: fmtShort(iso) + '（' + (-n) + '日超過）', c:'over' };
  if(n === 0) return { t:'今日', c:'soon' };
  if(n === 1) return { t:'明日', c:'soon' };
  if(n <= 7) return { t: fmtShort(iso) + '（あと' + n + '日）', c:'soon' };
  return { t: fmtDate(iso), c:'' };
}
function splitTags(s){ return String(s || '').split(/[,、，\s]+/).map(function(t){ return t.trim().replace(/^#/, ''); }).filter(Boolean); }
function getP(id){ return DB.projects.find(function(p){ return p.id === id; }); }
function getInv(id){ return DB.inventory.find(function(i){ return i.id === id; }); }
function projCost(p){ return p.expenses.reduce(function(s, e){ return s + (+e.amount || 0); }, 0); }
function projProgress(p){
  if(p.progressMode === 'manual') return Math.max(0, Math.min(100, +p.progressManual || 0));
  if(!p.milestones.length) return p.status === '完了' ? 100 : 0;
  var d = p.milestones.filter(function(m){ return m.done; }).length;
  return Math.round(d / p.milestones.length * 100);
}
function nextMilestone(p){
  return p.milestones.filter(function(m){ return !m.done; })
    .sort(function(a, b){ return (a.due || '9999') < (b.due || '9999') ? -1 : 1; })[0];
}
function touch(p){ p.updatedAt = new Date().toISOString(); }

var toastT;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

var I = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  yen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l6 8 6-8M12 12v8M7.5 13h9M7.5 16.5h9"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
};

/* ============================================================
   シート（フォーム）
   ============================================================ */
var LOCK_Y = 0;
function lockScroll(on){
  var b = document.body;
  if(on){
    if(b.classList.contains('lock')) return;
    LOCK_Y = window.scrollY; b.style.top = (-LOCK_Y) + 'px'; b.classList.add('lock');
  }else{
    var sheetOpen = $('#sheet').classList.contains('open'), sketchOpen = !$('#sketch').hidden;
    if(!b.classList.contains('lock') || sheetOpen || sketchOpen) return;
    b.classList.remove('lock'); b.style.top = ''; window.scrollTo(0, LOCK_Y);
  }
}
function openSheet(html, onMount){
  var s = $('#sheet');
  $('#sheetBody').innerHTML = html;
  s.hidden = false;
  lockScroll(true);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.classList.add('open'); }); });
  if(onMount) onMount($('#sheetBody'));
}
function closeSheet(){
  var s = $('#sheet');
  if(s.hidden) return;
  s.classList.remove('open');
  lockScroll(false);
  setTimeout(function(){ if(!s.classList.contains('open')){ s.hidden = true; $('#sheetBody').innerHTML = ''; } }, 230);
}

function fieldHTML(f, v){
  var id = 'f_' + f.k, val = (v === undefined || v === null) ? (f.def !== undefined ? f.def : '') : v;
  var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : '';
  var inp;
  if(f.type === 'textarea'){
    inp = '<textarea id="' + id + '" name="' + f.k + '" rows="' + (f.rows || 3) + '"' + ph + '>' + esc(val) + '</textarea>';
  }else if(f.type === 'select'){
    inp = '<select id="' + id + '" name="' + f.k + '">' + f.options.map(function(o){
      var ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o;
      return '<option value="' + esc(ov) + '"' + (ov === val ? ' selected' : '') + '>' + esc(ol) + '</option>';
    }).join('') + '</select>';
  }else if(f.type === 'check'){
    return '<label class="fld check"><input type="checkbox" id="' + id + '" name="' + f.k + '"' + (val ? ' checked' : '') + '><span>' + esc(f.label) + '</span></label>';
  }else{
    var type = f.type === 'tags' ? 'text' : (f.type || 'text');
    if(f.type === 'tags' && Array.isArray(val)) val = val.join(', ');
    var extra = type === 'number' ? ' inputmode="decimal" step="any"' : '';
    if(f.list) extra += ' list="dl_' + f.k + '"';
    inp = '<input type="' + type + '" id="' + id + '" name="' + f.k + '" value="' + esc(val) + '"' + ph + extra + (f.req ? ' required' : '') + (f.ro ? ' readonly tabindex="-1"' : '') + '>';
    if(f.list) inp += '<datalist id="dl_' + f.k + '">' + f.list.map(function(o){ return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
  }
  return '<label class="fld' + (f.w ? ' ' + f.w : '') + '"><span>' + esc(f.label) + (f.req ? ' *' : '') + '</span>' + inp + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '</label>';
}

/* opts: title, fields, values, top(html), bottom(html), onSave(vals)→false で閉じない, onDelete, delLabel, mount */
function formSheet(opts){
  var v = opts.values || {};
  var html = '<h2>' + esc(opts.title) + '</h2>' + (opts.top || '') +
    '<form class="form" id="sheetForm" autocomplete="off">' +
    opts.fields.map(function(f){ return fieldHTML(f, v[f.k]); }).join('') +
    '</form>' + (opts.bottom || '') +
    '<div class="formbtns">' +
      (opts.onDelete ? '<button type="button" class="btn danger" id="sheetDel">' + esc(opts.delLabel || '削除') + '</button>' : '') +
      '<span class="sp"></span><button type="button" class="btn" data-act="closeSheet">キャンセル</button>' +
      '<button type="submit" form="sheetForm" class="btn pri">保存</button>' +
    '</div>';
  openSheet(html, function(root){
    var form = $('#sheetForm', root);
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var out = {};
      opts.fields.forEach(function(f){
        var el = form.elements[f.k];
        if(!el || f.skip) return;
        if(f.type === 'check') out[f.k] = el.checked;
        else if(f.type === 'number') out[f.k] = el.value === '' ? '' : +el.value;
        else if(f.type === 'tags') out[f.k] = splitTags(el.value);
        else out[f.k] = el.value.trim();
      });
      for(var i = 0; i < opts.fields.length; i++){
        var f = opts.fields[i];
        if(f.req && !out[f.k] && out[f.k] !== 0){ toast(f.label + 'を入力してください'); form.elements[f.k].focus(); return; }
      }
      if(opts.onSave(out) !== false) closeSheet();
    });
    if(opts.onDelete) $('#sheetDel', root).addEventListener('click', function(){
      if(confirm(opts.delConfirm || '削除しますか？')){ opts.onDelete(); closeSheet(); }
    });
    if(opts.mount) opts.mount(root, form);
    var first = form.querySelector('input:not([type=checkbox]),textarea');
    if(first && !opts.values && window.matchMedia('(pointer:fine)').matches) first.focus();
  });
}

function parseRef(text){
  text = text.trim();
  var r = {};
  if(/^@\w+\s*[{(]/.test(text)){
    var get = function(k){
      var m = text.match(new RegExp('(?:^|[,\\s])' + k + '\\s*=\\s*(?:\\{((?:[^{}]|\\{(?:[^{}]|\\{[^{}]*\\})*\\})*)\\}|"([^"]*)"|(\\w+))', 'i'));
      if(!m) return '';
      return (m[1] != null ? m[1] : m[2] != null ? m[2] : m[3]).replace(/[{}]/g, '').replace(/\\&/g, '&').replace(/\s+/g, ' ').trim();
    };
    r.title = get('title');
    var au = get('author');
    if(au) r.authors = au.split(/\s+and\s+/i).map(function(a){
      if(a.indexOf(',') >= 0){ var x = a.split(','); return (x[1].trim() + ' ' + x[0].trim()).trim(); }
      return a.trim();
    }).join(', ');
    r.year = get('year');
    r.venue = get('journal') || get('booktitle') || get('publisher') || get('school') || get('howpublished');
    r.doi = get('doi');
    r.url = get('url');
    Object.keys(r).forEach(function(k){ if(!r[k]) delete r[k]; });
    return r;
  }
  var doi = text.match(/10\.\d{4,9}\/[^\s"<>]+/);
  if(doi) r.doi = doi[0].replace(/[.,;)\]]+$/, '');
  var arx = text.match(/arxiv\.org\/(?:abs|pdf)\/(\d{4}\.\d{4,5})/i) || text.match(/^arXiv:\s*(\d{4}\.\d{4,5})/i);
  if(arx && !r.doi) r.doi = '10.48550/arXiv.' + arx[1];
  var url = text.match(/https?:\/\/\S+/);
  if(url) r.url = url[0];
  return r;
}

function fetchCrossref(doi){
  return fetch('https://api.crossref.org/works/' + encodeURIComponent(doi))
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(function(j){
      var m = j.message || {};
      var cjk = /[぀-ヿ㐀-鿿]/;
      var au = (m.author || []).map(function(a){
        if(a.name) return a.name;
        var g = a.given || '', f = a.family || '';
        return cjk.test(f + g) ? f + g : (g + ' ' + f).trim();
      }).join(', ');
      var y = (m.issued && m.issued['date-parts'] && m.issued['date-parts'][0][0]) || '';
      return {
        title: (m.title || [])[0] || '',
        authors: au,
        year: y ? String(y) : '',
        venue: (m['container-title'] || [])[0] || m.publisher || '',
        doi: m.DOI || doi,
        url: m.URL || ''
      };
    });
}

function citeLine(r){
  var s = (r.authors || '著者不明') + ' (' + (r.year || 'n.d.') + '). ' + r.title + '.';
  if(r.venue) s += ' ' + r.venue + '.';
  if(r.doi) s += ' https://doi.org/' + r.doi;
  else if(r.url) s += ' ' + r.url;
  return s;
}

   画面
   ============================================================ */
/* ============================================================
   設計図・イメージ
   画像本体は容量の大きい IndexedDB に置き、localStorage には
   タイトルなどの情報だけを持つ。サムネイルは別キー（id + '_t'）。
   ============================================================ */
var FILES = (function(){
  var dbp;
  function open(){
    if(!dbp) dbp = new Promise(function(res, rej){
      var r = indexedDB.open('lab-desk-files', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('files'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction('files', mode), req = fn(t.objectStore('files'));
        t.oncomplete = function(){ res(req ? req.result : undefined); };
        t.onerror = t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    put: function(k, v){ return tx('readwrite', function(s){ return s.put(v, k); }); },
    get: function(k){ return tx('readonly', function(s){ return s.get(k); }); },
    del: function(k){ return tx('readwrite', function(s){ return s.delete(k); }); },
    keys: function(){ return tx('readonly', function(s){ return s.getAllKeys(); }); },
    clear: function(){ return tx('readwrite', function(s){ return s.clear(); }); }
  };
})();
var URLS = {};
function fileURL(k){
  if(!k) return Promise.resolve('');
  if(URLS[k]) return Promise.resolve(URLS[k]);
  return FILES.get(k).then(function(b){ return b ? (URLS[k] = URL.createObjectURL(b)) : ''; }).catch(function(){ return ''; });
}
function forgetURLs(){ Object.keys(URLS).forEach(function(k){ URL.revokeObjectURL(URLS[k]); }); URLS = {}; }
function hydrate(root){
  (root || document).querySelectorAll('img[data-img]').forEach(function(im){
    fileURL(im.dataset.img).then(function(u){ if(u) im.src = u; });
  });
}
function askPersist(){ try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} }

function loadImg(blob){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(blob), im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); };
    im.src = u;
  });
}
function toBlob(c, type, q){ return new Promise(function(res){ c.toBlob(res, type, q); }); }
function canvasOf(w, h, white){
  var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  if(white){ var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
  return c;
}
/* 大きすぎる写真は長辺 2200px に縮めて保存する（iPhone の写真は 1 枚 3〜5MB あるため） */
function prepareImage(file){
  return loadImg(file).then(function(im){
    var w = im.naturalWidth || 1200, h = im.naturalHeight || 900, MAX = 2200;
    if(file.type === 'image/svg+xml' || file.type === 'image/gif' || (file.size < 1.5e6 && Math.max(w, h) <= MAX)){
      return { blob:file, w:w, h:h, im:im };
    }
    var sc = Math.min(1, MAX / Math.max(w, h));
    var png = file.type === 'image/png';
    var c = canvasOf(w * sc, h * sc, !png);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return toBlob(c, png ? 'image/png' : 'image/jpeg', .86).then(function(b){
      if(png && b.size > 3e6){
        var c2 = canvasOf(c.width, c.height, true); c2.getContext('2d').drawImage(c, 0, 0);
        return toBlob(c2, 'image/jpeg', .86).then(function(b2){ return { blob:b2, w:c.width, h:c.height, im:im }; });
      }
      return { blob:b, w:c.width, h:c.height, im:im };
    });
  });
}
function makeThumb(im){
  var w = im.naturalWidth || im.width || 1200, h = im.naturalHeight || im.height || 900, sc = Math.min(1, 520 / Math.max(w, h));
  var c = canvasOf(w * sc, h * sc, true);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return toBlob(c, 'image/jpeg', .8);
}
function makePending(file){
  if(file.type === 'application/pdf'){
    return Promise.resolve({ blob:file, type:file.type, name:file.name || '', size:file.size });
  }
  return prepareImage(file).then(function(r){
    return makeThumb(r.im).then(function(tb){
      URL.revokeObjectURL(r.im.src);
      return { blob:r.blob, type:r.blob.type || file.type, w:r.w, h:r.h, thumb:tb, name:file.name || '', size:r.blob.size };
    });
  });
}
var STORING = 0;
function storePending(pending){
  var id = uid();
  STORING++;
  setTimeout(function(){ STORING = Math.max(0, STORING - 1); }, 15000);
  var meta = { id:id, thumb: pending.thumb ? id + '_t' : '', type:pending.type, w:pending.w || 0, h:pending.h || 0, size:pending.size || pending.blob.size, name:pending.name || '' };
  return Promise.all([FILES.put(id, pending.blob), pending.thumb ? FILES.put(id + '_t', pending.thumb) : null]).then(function(){ askPersist(); return meta; });
}
function dropFile(meta){
  if(!meta) return;
  [meta.id, meta.thumb].forEach(function(k){
    if(!k) return;
    FILES.del(k).catch(function(){});
    if(URLS[k]){ URL.revokeObjectURL(URLS[k]); delete URLS[k]; }
  });
}
function getD(id){ return DB.designs.find(function(d){ return d.id === id; }); }
function isPdf(d){ return d.file && d.file.type === 'application/pdf'; }
function fmtSize(n){ return n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB'; }
function projOptions(){ return [['', '（研究に紐づけない）']].concat(DB.projects.map(function(p){ return [p.id, p.title]; })); }

/* ---------- 手描きスケッチ ----------
   3 枚重ね：skBg（白地・方眼・下絵）/ skInk（描いた線）/ skPrev（直線・四角のドラッグ中の仮表示）
   線はベクターで持っておき、「元に戻す」で skInk を描き直す。 */
var SK = { tool:'pen', color:'#1B1F1C', size:1, grid:true, strokes:[], cur:null, pid:null };
var SK_COLORS = ['#1B1F1C','#B4531F','#2F5B8A','#C62828','#2D6A4E'];
var SK_SIZES = [2, 4, 8];
var SK_TOOLS = [
  ['pen','ペン','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>'],
  ['line','直線','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/></svg>'],
  ['rect','四角','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="6.5" width="15" height="11" rx="1"/></svg>'],
  ['circle','円','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7.5"/></svg>'],
  ['text','文字','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>'],
  ['eraser','消しゴム','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 20h10M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/></svg>']
];

function skToolsHTML(){
  return SK_TOOLS.map(function(t){ return '<button class="skt' + (SK.tool === t[0] ? ' on' : '') + '" data-sk="tool" data-v="' + t[0] + '" title="' + t[1] + '" aria-label="' + t[1] + '">' + t[2] + '</button>'; }).join('') +
    '<span class="skdiv"></span>' +
    SK_COLORS.map(function(c){ return '<button class="sw' + (SK.color === c ? ' on' : '') + '" data-sk="color" data-v="' + c + '" style="background:' + c + '" aria-label="色"></button>'; }).join('') +
    '<span class="skdiv"></span>' +
    SK_SIZES.map(function(s, i){ return '<button class="wd' + (SK.size === i ? ' on' : '') + '" data-sk="size" data-v="' + i + '" aria-label="太さ"><i style="width:' + (s + 3) + 'px;height:' + (s + 3) + 'px"></i></button>'; }).join('') +
    '<span class="skdiv"></span>' +
    (SK.bgImg ? '' : '<button class="skt' + (SK.grid ? ' on' : '') + '" data-sk="grid">方眼</button>');
}

function openSketch(opts){
  opts = opts || {};
  SK.strokes = []; SK.cur = null; SK.pid = null; SK.bgImg = null; SK.origin = opts.origin || null; SK.projectId = opts.projectId || '';
  $('#skTitle').textContent = opts.origin ? '書き込み：' + opts.origin.title : '手描きスケッチ';
  $('#sketch').hidden = false; lockScroll(true);
  $('#skTools').innerHTML = skToolsHTML();
  skUndoState();
  var ready = opts.bgBlob ? loadImg(opts.bgBlob) : Promise.resolve(null);
  ready.then(function(im){
    var st = $('#skStage'), sw = st.clientWidth - 24, sh = st.clientHeight - 24;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W, H;
    if(im){
      SK.bgImg = im;
      var iw = im.naturalWidth, ih = im.naturalHeight, sc = Math.min(1, 2000 / Math.max(iw, ih));
      W = Math.round(iw * sc); H = Math.round(ih * sc);
      $('#skTools').innerHTML = skToolsHTML();
    }else{
      var k = Math.min(dpr, 2400 / Math.max(sw, sh));
      W = Math.round(sw * k); H = Math.round(sh * k);
    }
    SK.W = W; SK.H = H;
    ['skBg','skInk','skPrev'].forEach(function(id){ var c = $('#' + id); c.width = W; c.height = H; });
    skFit(); skDrawBg(); skRedraw();
  }).catch(function(){ toast('画像を開けませんでした'); closeSketch(true); });
}
function skFit(){
  if($('#sketch').hidden || !SK.W) return;
  var st = $('#skStage'), sw = st.clientWidth - 24, sh = st.clientHeight - 24;
  var sc = Math.min(sw / SK.W, sh / SK.H);
  var w = $('#skWrap'); w.style.width = Math.floor(SK.W * sc) + 'px'; w.style.height = Math.floor(SK.H * sc) + 'px';
  SK.k = SK.W / Math.floor(SK.W * sc);   // CSS 1px あたりのキャンバス px
}
window.addEventListener('resize', skFit);
function skDrawBg(){
  var c = $('#skBg'), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  if(SK.bgImg){ x.drawImage(SK.bgImg, 0, 0, c.width, c.height); return; }
  if(!SK.grid) return;
  var step = 20 * SK.k;
  for(var i = 0, gx = 0; gx <= c.width; i++, gx = i * step){
    x.fillStyle = i % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(Math.round(gx), 0, Math.max(1, SK.k * (i % 5 ? .6 : 1)), c.height);
  }
  for(var j = 0, gy = 0; gy <= c.height; j++, gy = j * step){
    x.fillStyle = j % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(0, Math.round(gy), c.width, Math.max(1, SK.k * (j % 5 ? .6 : 1)));
  }
}
function skStyle(x, s){
  x.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
  x.strokeStyle = x.fillStyle = s.color; x.lineWidth = s.w; x.lineCap = 'round'; x.lineJoin = 'round';
}
function skDraw(x, s){
  skStyle(x, s);
  if(s.tool === 'pen' || s.tool === 'eraser'){
    var p = s.pts;
    if(p.length === 1){ x.beginPath(); x.arc(p[0][0], p[0][1], s.w / 2, 0, Math.PI * 2); x.fill(); }
    else{
      x.beginPath(); x.moveTo(p[0][0], p[0][1]);
      for(var i = 1; i < p.length - 1; i++){ x.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2); }
      x.lineTo(p[p.length - 1][0], p[p.length - 1][1]); x.stroke();
    }
  }else if(s.tool === 'line'){
    x.beginPath(); x.moveTo(s.a[0], s.a[1]); x.lineTo(s.b[0], s.b[1]); x.stroke();

function skRedraw(){

function skPos(e){ var r = $('#skPrev').getBoundingClientRect(); return [(e.clientX - r.left) * SK.k, (e.clientY - r.top) * SK.k]; }

(function(){
  var cv = $('#skPrev');
  cv.addEventListener('pointerdown', function(e){

      if(t){ var s = { tool:'text', color:SK.color, size:[16, 22, 32][SK.size] * SK.k, x:pt[0], y:pt[1], text:t }; SK.strokes.push(s); skDraw($('#skInk').getContext('2d'), s); skUndoState(); }

  });

    if(e.pointerId !== SK.pid || !SK.cur) return;
    var pt = skPos(e), s = SK.cur;

      s.pts.push(pt);
      var x = $('#skInk').getContext('2d'); skStyle(x, s);

      if(e.shiftKey && s.tool === 'line'){ if(Math.abs(pt[0] - s.a[0]) > Math.abs(pt[1] - s.a[1])) pt[1] = s.a[1]; else pt[0] = s.a[0]; }

    var s = SK.cur; SK.cur = null;

/* ============================================================
   端末間の同期（Google ドライブのアプリ専用領域）
   ・データは本人の Google ドライブの「アプリ専用フォルダ」（appDataFolder）に置く。
     ドライブの画面には出ず、このアプリ以外からは見えない。サーバーは使わない。
   ・レコード（研究・文献・費用・部品・設計図…）ごとに更新時刻 _u を持ち、
     削除は DB.deleted に墓標（id → 削除時刻）を残す。同期のたびに双方をマージするので、
     オフラインで別々の端末を編集しても、同じレコードでない限り両方の変更が残る。
   ・画像は 1 枚ずつ別ファイル（f-<キー>）。画像は書き換えないので、無いほうへ送るだけ。
   ============================================================ */
var GOOGLE_CLIENT_ID = '1088975026923-gg6ra210l32ql6g7hllg6i11qei8agm9.apps.googleusercontent.com';        // 公開してよい値。設定画面から端末ごとに入れることもできる
var PROJ_KIDS = ['refs','datasets','expenses','uses','milestones','logs'];
var SHADOW = {};

/* 各レコードを走査。kids はそのレコードが持つ子レコードの配列名 */
function eachRecord(db, fn){
  (db.projects || []).forEach(function(p){
    fn(p, PROJ_KIDS);
    PROJ_KIDS.forEach(function(k){ (p[k] || []).forEach(function(c){ fn(c, []); }); });
  });
  (db.inventory || []).forEach(function(i){ fn(i, []); });
  (db.designs || []).forEach(function(d){ fn(d, []); });
}
function recSig(rec, kids){
  var o = {};
  Object.keys(rec).sort().forEach(function(k){ if(k !== '_u' && kids.indexOf(k) < 0) o[k] = rec[k]; });
  return JSON.stringify(o);
}
function rebuildShadow(){
  SHADOW = {};
  eachRecord(DB, function(r, kids){ if(r.id){ if(!r._u) r._u = 1; SHADOW[r.id] = recSig(r, kids); } });
}
/* 前回の保存から変わったレコードに時刻を押し、消えたレコードは墓標にする */
function stampChanges(){
  var now = Date.now(), seen = {};
  eachRecord(DB, function(r, kids){
    if(!r.id) return;
    seen[r.id] = 1;
    var sg = recSig(r, kids);
    if(SHADOW[r.id] !== sg){ r._u = now; SHADOW[r.id] = sg; }
  });
  Object.keys(SHADOW).forEach(function(id){
    if(!seen[id]){ DB.deleted[id] = now; delete SHADOW[id]; }
  });
}
function mergeList(a, b, del, kids){
  var out = [], byB = {}, used = {};
  (b || []).forEach(function(r){ if(r && r.id) byB[r.id] = r; });
  function keep(r){ return !(del[r.id] && del[r.id] >= (r._u || 0)); }
  function one(x, y){
    var w = (y && (y._u || 0) > (x._u || 0)) ? y : x;
    var m = Object.assign({}, w);
    kids.forEach(function(k){ m[k] = mergeList(x[k] || [], (y && y[k]) || [], del, []); });
    return m;
  }
  (a || []).forEach(function(r){
    if(!r || !r.id) return;
    var o = byB[r.id]; used[r.id] = 1;
    var m = o ? one(r, o) : one(r, null);
    if(keep(m)) out.push(m);
  });
  (b || []).forEach(function(r){
    if(!r || !r.id || used[r.id]) return;
    var m = one(r, null);
    if(keep(m)) out.push(m);
  });
  return out;
}
function mergeDB(a, b){
  var del = {};
  [a.deleted || {}, b.deleted || {}].forEach(function(d){ Object.keys(d).forEach(function(id){ del[id] = Math.max(del[id] || 0, d[id]); }); });
  return {
    projects: mergeList(a.projects, b.projects, del, PROJ_KIDS),
    inventory: mergeList(a.inventory, b.inventory, del, []),
    designs: mergeList(a.designs, b.designs, del, []),
    deleted: del
  };
}
function syncPayload(db){
  var del = {};
  Object.keys(db.deleted || {}).sort().forEach(function(k){ del[k] = db.deleted[k]; });
  return JSON.stringify({ v:1, app:'lab-desk', projects:db.projects || [], inventory:db.inventory || [], designs:db.designs || [], deleted:del });
}

/* ---- Google ドライブ API ---- */
var DRIVE = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
function gfetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + SM.token }, opts.headers || {});
  return fetch(url, opts).then(function(r){
    if(!r.ok){ var e = new Error('Google ドライブ ' + r.status); e.status = r.status; throw e; }
    return r;
  });
}
function driveList(){
  var all = [];
  function page(tok){
    var u = DRIVE + '?spaces=appDataFolder&pageSize=1000&fields=' + encodeURIComponent('nextPageToken,files(id,name,createdTime)') + (tok ? '&pageToken=' + encodeURIComponent(tok) : '');
    return gfetch(u).then(function(r){ return r.json(); }).then(function(j){
      all = all.concat(j.files || []);
      return j.nextPageToken ? page(j.nextPageToken) : all;
    });
  }
  return page('');
}
function driveGet(id){ return gfetch(DRIVE + '/' + id + '?alt=media'); }
function driveCreate(name, body, type){
  var b = 'labdesk' + uid();
  var meta = JSON.stringify({ name:name, parents:['appDataFolder'] });
  var blob = new Blob(['--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: ' + (type || 'application/octet-stream') + '\r\n\r\n', body, '\r\n--' + b + '--']);
  return gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method:'POST', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body:blob }).then(function(r){ return r.json(); });
}
function driveUpdate(id, body, type){
  return gfetch(UPLOAD + '/' + id + '?uploadType=media', { method:'PATCH', headers:{ 'Content-Type': type || 'application/json' }, body:body });
}
function driveDelete(id){ return gfetch(DRIVE + '/' + id, { method:'DELETE' }).catch(function(e){ if(e.status !== 404) throw e; }); }

/* ---- 同期本体 ---- */
var SYNC = { running:false, again:false, timer:0, state:'off', detail:'' };
function uiBusy(){ return !$('#sheet').hidden || !$('#sketch').hidden; }
function setSyncState(st, detail){
  SYNC.state = st; SYNC.detail = detail || '';
  var b = $('#syncBtn');
  if(b){ b.className = 'iconbtn sync ' + st; b.title = syncLabel(); }
  var el = $('#syncStatus'); if(el) el.textContent = syncLabel();
}
function syncLabel(){
  return {
    off:'同期していません', ok:'同期済み' + (SM.last ? '（' + agoLabel(SM.last) + '）' : ''), syncing:'同期中…' + (SYNC.detail ? ' ' + SYNC.detail : ''),
    login:'再ログインが必要です（タップしてログイン）', error:'同期できませんでした：' + SYNC.detail, offline:'オフライン（つながったら同期します）'
  }[SYNC.state] || '';
}
function agoLabel(t){
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'たった今'; if(m < 60) return m + '分前';
  var h = Math.round(m / 60); if(h < 24) return h + '時間前';
  return fmtDate(new Date(t - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10));
}
function syncSoon(ms){
  if(!SM.signedIn || SYNC.applying) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(function(){ syncNow(false); }, ms == null ? 3000 : ms);
}
function syncNow(interactive){
  if(!clientId() || !SM.signedIn){ if(interactive) login(false); return Promise.resolve(); }
  if(!tokenOK()){
    if(interactive) login(false);
    else setSyncState('login');
    return Promise.resolve();
  }
  if(!navigator.onLine){ setSyncState('offline'); return Promise.resolve(); }
  if(SYNC.running){ SYNC.again = true; return Promise.resolve(); }
  if(uiBusy()){ syncSoon(4000); return Promise.resolve(); }
  SYNC.running = true; setSyncState('syncing');
  var changedView = false;
  return driveList().then(function(files){
    var jsons = files.filter(function(x){ return x.name === 'lab-desk.json'; });
    var remote = null, remoteStr = '';
    return jsons.reduce(function(pr, fl){
      return pr.then(function(){ return driveGet(fl.id).then(function(r){ return r.json(); }).then(function(d){
        remote = remote ? Object.assign(mergeDB(remote, d), {}) : d;
      }); });
    }, Promise.resolve()).then(function(){
      if(remote){
        remoteStr = syncPayload(remote);
        if(uiBusy()){ var e = new Error('busy'); e.busy = true; throw e; }
        stampChanges();
        var m = mergeDB(DB, remote);
        if(syncPayload(m) !== syncPayload(DB)){
          SYNC.applying = true;
          DB.projects = m.projects; DB.inventory = m.inventory; DB.designs = m.designs; DB.deleted = m.deleted;
          normalize(DB); rebuildShadow(); save();
          SYNC.applying = false;
          changedView = true;
        }
      }
      return syncFiles(files).then(function(dl){ if(dl) changedView = true; });
    }).then(function(){
      var mine = syncPayload(DB);
      var w;
      if(!jsons.length) w = driveCreate('lab-desk.json', mine, 'application/json');
      else if(mine !== remoteStr || jsons.length > 1) w = driveUpdate(jsons[0].id, mine, 'application/json');
      return Promise.resolve(w).then(function(){
        return Promise.all(jsons.slice(1).map(function(x){ return driveDelete(x.id); }));
      });
    });
  }).then(function(){
    SM.last = Date.now(); saveSM();
    setSyncState('ok');
    if(changedView && !uiBusy()) render(true);
  }).catch(function(e){
    SYNC.applying = false;
    if(e.busy){ syncSoon(4000); setSyncState('ok'); }
    else if(e.status === 401 || e.status === 403){ SM.token = ''; SM.exp = 0; saveSM(); setSyncState('login'); }
    else if(!navigator.onLine) setSyncState('offline');
    else setSyncState('error', e.message || '通信エラー');
  }).then(function(){
    SYNC.running = false;
    if(SYNC.again){ SYNC.again = false; syncSoon(500); }
  });
}
/* 画像：無いほうへ送る。どの設計図からも使われなくなったものは片づける */
function syncFiles(files){
  var remote = {};
  files.forEach(function(x){ if(x.name.indexOf('f-') === 0) remote[x.name.slice(2)] = x; });
  var need = {};
  DB.designs.forEach(function(d){ if(d.file){ if(d.file.id) need[d.file.id] = 1; if(d.file.thumb) need[d.file.thumb] = 1; } });
  var downloaded = 0;
  return FILES.keys().then(function(localKeys){
    var local = {}; localKeys.forEach(function(k){ local[k] = 1; });
    var up = Object.keys(need).filter(function(k){ return local[k] && !remote[k]; });
    var down = Object.keys(need).filter(function(k){ return !local[k] && remote[k]; });
    var total = up.length + down.length, done = 0;
    function tick(){ done++; setSyncState('syncing', '画像 ' + done + '/' + total); }
    var chain = Promise.resolve();
    up.forEach(function(k){ chain = chain.then(function(){ return FILES.get(k).then(function(b){ return b ? driveCreate('f-' + k, b, b.type) : null; }).then(tick); }); });
    down.forEach(function(k){ chain = chain.then(function(){ return driveGet(remote[k].id).then(function(r){ return r.blob(); }).then(function(b){ downloaded++; return FILES.put(k, b); }).then(tick); }); });
    return chain.then(function(){
      var dayAgo = Date.now() - 864e5;
      var gcRemote = Object.keys(remote).filter(function(k){ return !need[k] && new Date(remote[k].createdTime).getTime() < dayAgo; });
      var gcLocal = STORING ? [] : localKeys.filter(function(k){ return !need[k]; });
      gcLocal.forEach(function(k){ FILES.del(k).catch(function(){}); if(URLS[k]){ URL.revokeObjectURL(URLS[k]); delete URLS[k]; } });
      return Promise.all(gcRemote.map(function(k){ return driveDelete(remote[k].id); }));
    }).then(function(){ return downloaded; });
  });
}
function syncStartup(){
  if(!SM.signedIn || !clientId()) return;
  if(SYNC.justLoggedIn){
    SYNC.justLoggedIn = false;
    driveAbout().then(function(a){ if(a.user){ SM.email = a.user.emailAddress; SM.name = a.user.displayName; saveSM(); render(true); } }).catch(function(){});
    toast('ログインしました。同期します');

  }

  /* トークン切れ：オンラインなら Google に黙って取り直しに行く（10分に1回まで） */
  var last = +(localStorage.getItem('lab-desk-silent') || 0);
  if(navigator.onLine && !SM.needLogin && Date.now() - last > 10 * 60000){
    try{ localStorage.setItem('lab-desk-silent', String(Date.now())); }catch(e){}

  }else setSyncState('login');
}
document.addEventListener('visibilitychange', function(){

function topbar(html){ $('#topbar').innerHTML = html; }
function brandBar(extra){
  topbar('<div class="brand"><i></i>研究デスク</div><span class="sp"></span>' + (extra || '') +
    '<span class="mono small faint">' + fmtDate(todayISO()) + '</span>' +
    (SM.signedIn ? '<button class="iconbtn sync ' + SYNC.state + '" id="syncBtn" data-act="syncNow" title="' + esc(syncLabel()) + '" aria-label="同期">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.1 4.75 4.75 0 0 0 7 18.5z"/><path class="ok" d="M9.5 13.5l2 2 3.5-3.5"/><path class="bang" d="M12 10.5v3M12 16v.01"/></svg></button>' : ''));
}

function viewHome(){
  brandBar();
  var ps = DB.projects;
  if(!ps.length && !DB.inventory.length){
    return '<div class="card empty" style="margin-top:8px"><div class="big">まだ研究が登録されていません</div>' +
      '<div>研究ごとに、概要・先行研究・費用と備品・進捗・予定をまとめておけます。<br>手持ちの部品や工具は「部品・工具」タブに記録できます。</div>' +
      '<div class="btnrow"><button class="btn pri" data-act="projNew">' + I.plus + '研究を追加</button><button class="btn" data-act="loadSample">サンプルで試す</button></div></div>';
  }
  var active = ps.filter(function(p){ return p.status === '進行中'; }).length;
  var total = ps.reduce(function(s, p){ return s + projCost(p); }, 0);
  var upcoming = allMilestones().filter(function(x){ return !x.m.done && x.m.due && daysUntil(x.m.due) <= 14; })
    .sort(function(a, b){ return a.m.due < b.m.due ? -1 : 1; });

  var h = '<div class="stats">' +
    stat('進行中', active, '件') + stat('費用の合計', yen(total)) +
    stat('2週間以内の予定', upcoming.length, '件') + stat('部品・工具', DB.inventory.length, '品目') + '</div>';

  if(upcoming.length){
    h += '<div class="sec"><h2>近い予定</h2><span class="sp"></span><a class="lnk" href="#/plan">すべて見る</a></div>' +
      '<div class="card rows">' + upcoming.slice(0, 5).map(msRow).join('') + '</div>';
  }

  var counts = { 'すべて': ps.length };
  STATUSES.forEach(function(s){ counts[s] = ps.filter(function(p){ return p.status === s; }).length; });
  h += '<div class="sec"><h2>研究</h2></div><div class="chips">' + ['すべて'].concat(STATUSES).map(function(s){
    return '<button class="chip' + (UI.projFilter === s ? ' on' : '') + '" data-act="projFilter" data-v="' + s + '">' + s + ' <b>' + counts[s] + '</b></button>';
  }).join('') + '</div>';

  var order = { '進行中':0, '計画中':1, '中断':2, '完了':3 };
  var list = ps.filter(function(p){ return UI.projFilter === 'すべて' || p.status === UI.projFilter; })
    .slice().sort(function(a, b){ return (order[a.status] - order[b.status]) || ((b.updatedAt || '') > (a.updatedAt || '') ? 1 : -1); });
  h += list.length ? '<div class="plist" style="margin-top:8px">' + list.map(projCard).join('') + '</div>'
    : '<div class="card empty" style="margin-top:8px">この状態の研究はありません</div>';
  h += '<button class="fab" data-act="projNew">' + I.plus + '研究を追加</button>';
  return h;
}
function stat(k, v, unit){ return '<div class="card stat"><div class="k">' + k + '</div><div class="v">' + esc(v) + (unit ? '<small>' + unit + '</small>' : '') + '</div></div>'; }

function projCard(p){
  var pr = projProgress(p), nx = nextMilestone(p), dl = nx ? dueLabel(nx.due) : null;
  return '<a class="card proj" href="#/p/' + p.id + '">' +
    '<div class="hd"><h3>' + esc(p.title) + '</h3><span class="pill st-' + esc(p.status) + '">' + esc(p.status) + '</span></div>' +
    (p.summary ? '<div class="sum">' + esc(p.summary) + '</div>' : '<div style="height:10px"></div>') +
    '<div class="pr"><div class="bar' + (pr >= 100 ? ' done' : '') + '"><i style="width:' + pr + '%"></i></div><span class="n">' + pr + '%</span></div>' +
    '<div class="meta"><span>' + I.book + (p.refs.length + p.datasets.length) + '</span><span>' + I.yen + yen(projCost(p)) + '</span><span>' + I.chip + p.uses.length + '</span>' +
    (nx ? '<span class="next">' + I.flag + esc(nx.title) + ' <span class="due ' + dl.c + '">' + esc(dl.t) + '</span></span>' : '') +
    (p.targetDate ? '<span>締切 ' + fmtDate(p.targetDate) + '</span>' : '') + '</div></a>';
}

function allMilestones(){
  var out = [];
  DB.projects.forEach(function(p){ p.milestones.forEach(function(m){ out.push({ p:p, m:m }); }); });
  return out;
}
function msRow(x, showProj){
  var dl = dueLabel(x.m.due);
  showProj = showProj !== false;
  return '<div class="row' + (x.m.done ? ' done' : '') + '">' +
    '<button class="chk' + (x.m.done ? ' on' : '') + '" data-act="msToggle" data-p="' + x.p.id + '" data-m="' + x.m.id + '" aria-label="完了にする">' + I.check + '</button>' +
    '<a class="main" style="color:inherit" href="#/p/' + x.p.id + '/plan"><div class="t">' + esc(x.m.title) + '</div>' +
    (showProj ? '<div class="s">' + esc(x.p.title) + '</div>' : '') + '</a>' +
    '<span class="due ' + (x.m.done ? '' : dl.c) + '">' + (x.m.done ? '完了 ' + fmtShort(x.m.doneDate) : esc(dl.t)) + '</span></div>';
}

function viewPlan(){
  brandBar();
  var all = allMilestones();
  var open = all.filter(function(x){ return !x.m.done && x.p.status !== '完了'; })
    .sort(function(a, b){ return (a.m.due || '9999') < (b.m.due || '9999') ? -1 : 1; });
  if(!all.length) return '<div class="card empty"><div class="big">予定はまだありません</div>研究の「予定」タブで、節目やタスクを期限つきで登録するとここに集まります。</div>';
  var groups = [
    ['期限切れ', function(x){ return x.m.due && daysUntil(x.m.due) < 0; }],
    ['今週（7日以内）', function(x){ return x.m.due && daysUntil(x.m.due) >= 0 && daysUntil(x.m.due) <= 7; }],
    ['今月（30日以内）', function(x){ return x.m.due && daysUntil(x.m.due) > 7 && daysUntil(x.m.due) <= 30; }],
    ['それ以降', function(x){ return x.m.due && daysUntil(x.m.due) > 30; }],
    ['期限なし', function(x){ return !x.m.due; }]
  ];
  var h = '';
  groups.forEach(function(g){
    var items = open.filter(g[1]);
    if(!items.length) return;
    h += '<div class="sec"><h2>' + g[0] + '</h2><span class="mono small faint">' + items.length + '</span></div><div class="card rows">' + items.map(function(x){ return msRow(x); }).join('') + '</div>';
  });
  if(!h) h = '<div class="card empty"><div class="big">未完了の予定はありません</div></div>';
  var done = all.filter(function(x){ return x.m.done; }).sort(function(a, b){ return (b.m.doneDate || '') > (a.m.doneDate || '') ? 1 : -1; }).slice(0, 10);
  if(done.length) h += '<div class="sec"><h2>最近完了</h2></div><div class="card rows">' + done.map(function(x){ return msRow(x); }).join('') + '</div>';
  return h;
}

var PTABS = [['overview','概要'],['refs','出典'],['design','設計図'],['cost','費用・備品'],['progress','進捗'],['plan','予定']];

function viewProject(p, tab){

    '<button class="iconbtn" data-act="projEdit" aria-label="編集">' + I.edit + '</button>');
  var pr = projProgress(p);
  var cnt = { design:DB.designs.filter(function(d){ return d.projectId === p.id; }).length, refs:p.refs.length + p.datasets.length, cost:p.expenses.length + p.uses.length, progress:p.logs.length, plan:p.milestones.length };
  var h = '<div class="card phead"><div class="st"><span class="pill st-' + esc(p.status) + '">' + esc(p.status) + '</span>' +
    (p.startDate || p.targetDate ? '<span class="mono small muted">' + (p.startDate ? fmtDate(p.startDate) : '') + ' → ' + (p.targetDate ? fmtDate(p.targetDate) : '未定') + '</span>' : '') +
    (p.targetDate && p.status !== '完了' ? (function(){ var n = daysUntil(p.targetDate); return '<span class="pill plain ' + (n < 0 ? 'bad' : n <= 14 ? 'warn' : '') + '">' + (n < 0 ? (-n) + '日超過' : '締切まで' + n + '日') + '</span>'; })() : '') +
    '</div><h2>' + esc(p.title) + '</h2>' +
    '<div class="pr"><div class="bar' + (pr >= 100 ? ' done' : '') + '"><i style="width:' + pr + '%"></i></div><span class="n">' + pr + '%</span></div></div>' +
    '<div class="seg" role="tablist">' + PTABS.map(function(t){
      return '<a role="tab" href="#/p/' + p.id + '/' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + (cnt[t[0]] ? '<b>' + cnt[t[0]] + '</b>' : '') + '</a>';

function tabOverview(p){
  var dd = function(label, v){ return '<div><dt>' + label + '</dt><dd' + (v ? '' : ' class="none"') + '>' + (v ? esc(v) : '未記入') + '</dd></div>'; };
  var h = '<div class="sec"><h2>研究の概要</h2><span class="sp"></span><button class="btn sm" data-act="projEdit">' + I.edit + '編集</button></div>' +
    '<div class="card"><dl class="dl" style="margin:0">' + dd('概要', p.summary) + dd('研究課題・目的', p.question) + dd('方法・アプローチ', p.method) + dd('成果物・発表先', p.outcome) +
    '<div><dt>タグ</dt><dd>' + (p.tags.length ? '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">#' + esc(t) + '</span>'; }).join('') + '</div>' : '<span class="faint">なし</span>') + '</dd></div>' +
    '</dl></div>';
  var nx = nextMilestone(p);
  var lastLog = p.logs.slice().sort(function(a, b){ return (b.date || '') > (a.date || '') ? 1 : -1; })[0];

    stat('文献・データ', p.refs.length + p.datasets.length, '件') + stat('費用', yen(projCost(p))) + stat('備品', p.uses.length, '点') +
    stat('予定', p.milestones.filter(function(m){ return m.done; }).length + '/' + p.milestones.length, '完了') + '</div>';

function datasetForm(p, d){
  var isNew = !d;
  formSheet({
    title: isNew ? 'データセットを追加' : 'データセットを編集',
    values: d,
    top: '<div class="paste"><textarea id="pasteRef" placeholder="DOI・データのページの URL・BibTeX を貼り付け"></textarea>' +
      '<div class="btnrow"><button type="button" class="btn sm" id="pasteGo">読み取る</button><span class="hint" style="align-self:center">DOI（Zenodo・Figshare・Dryad なども可）があれば書誌を取得します</span></div></div>',
    fields: [
      { k:'name', label:'データセット名', req:true, type:'textarea', rows:2, ph:'例：過去の気象データ（東京・1時間値）' },
      { k:'provider', label:'提供元・作成者', ph:'機関名や作成者', w:'half' },
      { k:'year', label:'公開年', w:'half', ph:'2024' },
      { k:'version', label:'版・バージョン', w:'half', ph:'v2.1、2024年版 など' },
      { k:'status', label:'状態', type:'select', options:DS_STATUS, def:'取得済み', w:'half' },
      { k:'doi', label:'DOI', w:'half', ph:'10.5281/zenodo.xxxxx' },
      { k:'url', label:'URL', type:'url', w:'half' },
      { k:'license', label:'ライセンス・利用条件', w:'half', list:['CC BY 4.0','CC BY-SA 4.0','CC BY-NC 4.0','CC0 1.0','ODbL','政府標準利用規約','研究目的のみ','要申請','不明'] },
      { k:'accessed', label:'取得日（参照日）', type:'date', def:todayISO(), w:'half' },
      { k:'format', label:'形式', w:'half', list:['CSV','JSON','Excel','NetCDF','HDF5','画像','音声','動画','SQL','その他'] },
      { k:'size', label:'規模', w:'half', ph:'12,000 行、3.2GB など' },
      { k:'location', label:'手元の保存先', ph:'例：Google Drive/研究/data/jma_2024.csv' },
      { k:'usage', label:'この研究での使い方', type:'textarea', rows:2, ph:'何と比較するか、どの列を使うか など' },
      { k:'citation', label:'指定の引用表記', type:'textarea', rows:2, hint:'提供元が引用の書き方を指定している場合はそのまま貼っておく（一覧のコピーでこちらが優先されます）' },
      { k:'note', label:'メモ', type:'textarea', rows:2, ph:'前処理、欠損、注意点 など' }
    ],
    mount: function(root, form){
      $('#pasteGo', root).addEventListener('click', function(){
        var text = $('#pasteRef', root).value;
        if(!text.trim()) return;
        var got = parseRef(text), m;
        if(!got.doi && (m = text.match(/zenodo\.org\/(?:records?|deposit)\/(\d+)/i))) got.doi = '10.5281/zenodo.' + m[1];
        var out = { name:got.title, provider:got.authors || got.venue, year:got.year, doi:got.doi, url:got.url };
        fill(out);
        if(got.doi && !got.title){
          toast('書誌を問い合わせ中…');
          fetchCSL(got.doi).then(function(c){ fill(c); toast('書誌を取得しました'); })
            .catch(function(){ toast('取得できませんでした（DOI とオンライン状態を確認）'); });
        }else if(out.name || out.url || out.doi){ toast('読み取りました'); }
        else toast('読み取れる情報が見つかりませんでした');
      });
      function fill(o){
        Object.keys(o).forEach(function(k){ if(o[k] && form.elements[k]) form.elements[k].value = o[k]; });
      }
    },
    onSave: function(v){
      if(isNew){ v.id = uid(); p.datasets.push(v); }
      else Object.assign(d, v);
      touch(p); save(); render(true);
    },
    onDelete: isNew ? null : function(){ p.datasets = p.datasets.filter(function(x){ return x !== d; }); touch(p); save(); render(true); }
  });
}

/* doi.org の CSL-JSON。CrossRef の DOI も DataCite（Zenodo など）の DOI も同じ形で返る */
function fetchCSL(doi){
  return fetch('https://doi.org/' + encodeURI(doi), { headers:{ Accept:'application/vnd.citationstyles.csl+json' } })
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(function(m){
      var cjk = /[\u3040-\u30ff\u3400-\u9fff]/;
      var au = (m.author || []).map(function(a){
        if(a.literal) return a.literal;
        var g = a.given || '', f = a.family || '';
        return cjk.test(f + g) ? f + g : (g + ' ' + f).trim();
      }).join(', ');
      var y = (m.issued && m.issued['date-parts'] && m.issued['date-parts'][0] && m.issued['date-parts'][0][0]) || '';
      return {
        name: Array.isArray(m.title) ? m.title[0] : (m.title || ''),
        provider: au || m.publisher || '',
        year: y ? String(y) : '',
        version: m.version || '',
        doi: m.DOI || doi,
        url: m.URL || ''
      };
    });
}

function datasetCite(d){
  if(d.citation) return d.citation;
  var s = (d.provider || '提供元不明') + ' (' + (d.year || 'n.d.') + '). ' + d.name;
  if(d.version) s += ' (' + d.version + ')';
  s += ' [データセット].';
  if(d.doi) s += ' https://doi.org/' + d.doi;
  else if(d.url) s += ' ' + d.url;
  if(d.accessed) s += '（' + fmtDate(d.accessed) + ' 取得）';
  if(d.license) s += ' ライセンス: ' + d.license;
  return s;
}

function tabPapers(p){
  var h = '<div class="sec"><h2>先行研究・参考文献</h2><span class="sp"></span>' +
    (p.refs.length ? '<button class="btn sm ghost" data-act="refCopy">' + I.copy + '一覧をコピー</button>' : '') +

/* ---------- 部品・工具 ---------- */
function isLow(i){ return i.minQty !== '' && i.minQty != null && unusedQty(i) <= +i.minQty; }
function invFiltered(){
  var q = UI.invQuery.toLowerCase().split(/\s+/).filter(Boolean);
  return DB.inventory.filter(function(i){
    if(UI.invCat !== 'すべて' && i.category !== UI.invCat) return false;
    if(UI.invLow && !isLow(i)) return false;
    if(UI.invView === '未使用' && unusedQty(i) <= 0) return false;
    if(UI.invView === '使用済み' && usedQty(i) <= 0) return false;
    if(!q.length) return true;
    var hay = [i.name, i.model, i.category, i.location, i.shop, i.note].concat(i.tags || []).join(' ').toLowerCase();
    return q.every(function(w){ return hay.indexOf(w) >= 0; });
  });
}

      }else{

      return '<div class="row inv"><button class="main" style="text-align:left" data-act="invEdit" data-id="' + i.id + '"><div class="t">' + esc(i.name) + (i.model ? '<small>' + esc(i.model) + '</small>' : '') + '</div>' +

  }).join('');

   ============================================================ */
function parseRoute(){ return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function render(keepScroll){
  var parts = parseRoute(), v = parts[0] || 'home', nav = v, html;
  if(v === 'p'){
    var p = getP(parts[1]);
    if(p && parts[2] === 'datasets') parts[2] = 'refs';
    if(!p){ location.replace('#/'); return; }
    UI.cur = p; html = viewProject(p, parts[2] || 'overview'); nav = 'home';
  }else if(v === 'plan') html = viewPlan();
  else if(v === 'inv') html = viewInv();
  else if(v === 'designs') html = viewDesigns();
  else if(v === 'settings'){ html = viewSettings(); setTimeout(showUsage, 0); }
  else { nav = 'home'; html = viewHome(); }
  var y = window.scrollY;
  $('#view').innerHTML = html;
  document.querySelectorAll('nav.tabs a').forEach(function(a){ a.classList.toggle('on', a.dataset.nav === nav); });
  hydrate($('#view'));
  var segOn = $('.seg a.on');
  if(segOn){ var sg = segOn.parentNode; sg.scrollLeft = segOn.offsetLeft - (sg.clientWidth - segOn.offsetWidth) / 2; }
  if(v === 'inv'){
    $('#invQ').addEventListener('input', function(e){ UI.invQuery = e.target.value; $('#invList').innerHTML = invListHTML(); });
  }
  var key = parts.join('/');
  if(keepScroll) window.scrollTo(0, y);
  else if(key !== UI.lastRoute) window.scrollTo(0, 0);
  UI.lastRoute = key;
}
window.addEventListener('hashchange', function(){ closeSheet(); render(false); });

function applyTheme(){
  var t = DB.settings.theme || 'auto';
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
