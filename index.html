document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el || !ACT[el.dataset.act]) return;
  if(el.tagName === 'BUTTON' || el.dataset.act !== 'closeSheet') e.preventDefault();
  if(el.tagName === 'A' && el.dataset.act === 'closeSheet'){ closeSheet(); return; }
  ACT[el.dataset.act](el, e);
});
document.addEventListener('change', function(e){
  var k = e.target.dataset.chg;
  if(k === 'theme'){ DB.settings.theme = e.target.value; save(); applyTheme(); }
  else if(k === 'invLow'){ UI.invLow = e.target.checked; $('#invList').innerHTML = invListHTML(); }
  else if(e.target.dataset.input === 'prRange'){ UI.cur.progressManual = +e.target.value; touch(UI.cur); save(); render(true); }
});
document.addEventListener('input', function(e){
  if(e.target.dataset.input === 'prRange') $('#prVal').textContent = e.target.value + '%';
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(!$('#lightbox').hidden){ $('#lightbox').hidden = true; return; }
  if(!$('#sketch').hidden){ closeSketch(); return; }
  closeSheet();
});

$('#importFile').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d || !d.v || !Array.isArray(d.projects)) throw new Error('形式が違います');
      if(!confirm('研究 ' + d.projects.length + ' 件・設計図 ' + (d.designs || []).length + ' 件・部品 ' + (d.inventory || []).length + ' 品目を読み込み、いまのデータを置き換えます。よろしいですか？')) return;
      var files = d.files || {};
      toast('読み込み中…');
      FILES.clear().then(function(){
        return Promise.all(Object.keys(files).map(function(k){
          return fetch(files[k]).then(function(r){ return r.blob(); }).then(function(b){ return FILES.put(k, b); });
        }));
      }).then(function(){
        forgetURLs(); DB = normalize(d); save(); applyTheme(); location.hash = '#/'; render(false); toast('読み込みました');
      }).catch(function(){ toast('画像の読み込みに失敗しました'); });
    }catch(err){ toast('読み込めませんでした：' + err.message); }
  };
  rd.readAsText(f);
});

function showUsage(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(function(e){
    var el = $('#usage'); if(el && e.usage != null) el.textContent += ' ・ 画像を含む全体 ' + fmtSize(e.usage);
  }).catch(function(){});
}
function blobToDataURL(b){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(b); });
}
function csv(rows){
  return '﻿' + rows.map(function(r){
    return r.map(function(c){ c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',');
  }).join('\r\n');
}
function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
  }else fallback();
  function fallback(){
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('コピーできませんでした'); }
    t.remove();
  }
}

/* サンプルのブロック図をキャンバスで描いて保存する */
function sampleDesign(p1){
  var c = canvasOf(1400, 900, true), x = c.getContext('2d');
  for(var i = 0; i <= 70; i++){ x.fillStyle = i % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(i * 20, 0, 1, 900); }
  for(var j = 0; j <= 45; j++){ x.fillStyle = j % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(0, j * 20, 1400, 1); }
  var F = '"IBM Plex Sans JP", sans-serif';
  function box(bx, by, w, h, title, sub, col){
    x.fillStyle = '#fff'; x.fillRect(bx, by, w, h);
    x.strokeStyle = col; x.lineWidth = 4; x.strokeRect(bx, by, w, h);
    x.fillStyle = '#1B1F1C'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '700 34px ' + F; x.fillText(title, bx + w / 2, by + h / 2 - (sub ? 18 : 0));
    if(sub){ x.font = '500 22px ' + F; x.fillStyle = '#5F6862'; x.fillText(sub, bx + w / 2, by + h / 2 + 24); }
  }
  function wire(pts, col, label, lx, ly){
    x.strokeStyle = col; x.lineWidth = 4; x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(function(p){ x.lineTo(p[0], p[1]); }); x.stroke();
    if(label){ x.fillStyle = col; x.font = '600 22px ' + F; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(label, lx, ly); }
  }
  x.fillStyle = '#1B1F1C'; x.font = '700 40px ' + F; x.textAlign = 'left'; x.textBaseline = 'top';
  x.fillText('CO₂ロガー　ブロック図（試作1号）', 60, 44);
  wire([[520, 400], [760, 400]], '#2F5B8A', 'I2C  SDA/SCL', 560, 372);
  wire([[640, 400], [640, 250], [760, 250]], '#2F5B8A');
  wire([[640, 400], [640, 560], [760, 560]], '#2F5B8A');
  wire([[340, 720], [340, 490]], '#C62828', 'USB 5V', 356, 610);
  wire([[430, 310], [430, 170], [1040, 170]], '#2D6A4E', 'Wi-Fi（1分ごとに送信）', 460, 142);
  box(160, 310, 360, 180, 'ESP32', 'DevKitC / 3.3V', '#B4531F');
  box(760, 190, 320, 120, 'SCD41', 'CO₂ 400–5000ppm', '#1B1F1C');
  box(760, 350, 320, 110, 'BME280', '温度・湿度・気圧', '#1B1F1C');
  box(760, 500, 320, 120, 'OLED', 'SSD1306 128×64', '#1B1F1C');
  box(1040, 110, 330, 110, 'スプレッドシート', 'HTTPS POST', '#2D6A4E');
  box(200, 720, 280, 100, 'モバイル電源', '5V 2.4A', '#C62828');
  x.fillStyle = '#B4531F'; x.font = '500 24px ' + F; x.textAlign = 'left'; x.textBaseline = 'top';
  x.fillText('※ SCD41 は通気口の近くに。基板の発熱から 3cm 以上離す', 560, 700);
  return toBlob(c, 'image/png').then(function(b){ return makePending(b); }).then(function(pd){ return storePending(pd); }).then(function(meta){
    DB.designs.unshift({ id:uid(), createdAt:new Date().toISOString(), title:'CO₂ロガーのブロック図', projectId:p1.id, kind:'ブロック図', version:'試作1号', date:addDays(-20), tags:['配線','I2C'],
      note:'I2C の 3 デバイスは同じバスにぶら下げる（SCD41: 0x62 / BME280: 0x76 / OLED: 0x3C）。\nプルアップはモジュール側のものを使う。', file:meta });
    save(); render(true);
  });
}
