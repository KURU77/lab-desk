function driveList(){
  var all = [];
  function page(tok){
    var u = DRIVE + '?spaces=appDataFolder&pageSize=1000&fields=' + encodeURIComponent('nextPageToken,files(id,name,createdTime)') + (tok ? '&pageToken=' + encodeURIComponent(tok) : '');
    return gfetch(u).then(function(r){ return r.json(); }).then(function(j){
      all = all.concat(j.files || []);
      return j.nextPageToken ? page(j.nextPageToken) : all;
    });
  }
  return page('');
}
function driveGet(id){ return gfetch(DRIVE + '/' + id + '?alt=media'); }
function driveCreate(name, body, type){
  var b = 'labdesk' + uid();
  var meta = JSON.stringify({ name:name, parents:['appDataFolder'] });
  var blob = new Blob(['--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: ' + (type || 'application/octet-stream') + '\r\n\r\n', body, '\r\n--' + b + '--']);
  return gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method:'POST', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body:blob }).then(function(r){ return r.json(); });
}
function driveUpdate(id, body, type){
  return gfetch(UPLOAD + '/' + id + '?uploadType=media', { method:'PATCH', headers:{ 'Content-Type': type || 'application/json' }, body:body });
}
function driveDelete(id){ return gfetch(DRIVE + '/' + id, { method:'DELETE' }).catch(function(e){ if(e.status !== 404) throw e; }); }
function driveAbout(){
  return gfetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)').then(function(r){ return r.json(); });
}

/* ---- 同期本体 ---- */
var SYNC = { running:false, again:false, timer:0, state:'off', detail:'' };
function uiBusy(){ return !$('#sheet').hidden || !$('#sketch').hidden; }
function setSyncState(st, detail){
  SYNC.state = st; SYNC.detail = detail || '';
  var b = $('#syncBtn');
  if(b){ b.className = 'iconbtn sync ' + st; b.title = syncLabel(); }
  var el = $('#syncStatus'); if(el) el.textContent = syncLabel();
}
function syncLabel(){
  return {
    off:'同期していません', ok:'同期済み' + (SM.last ? '（' + agoLabel(SM.last) + '）' : ''), syncing:'同期中…' + (SYNC.detail ? ' ' + SYNC.detail : ''),
    login:'再ログインが必要です（タップしてログイン）', error:'同期できませんでした：' + SYNC.detail, offline:'オフライン（つながったら同期します）'
  }[SYNC.state] || '';
}
function agoLabel(t){
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'たった今'; if(m < 60) return m + '分前';
  var h = Math.round(m / 60); if(h < 24) return h + '時間前';
  return fmtDate(new Date(t - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10));
}
function syncSoon(ms){
  if(!SM.signedIn || SYNC.applying) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(function(){ syncNow(false); }, ms == null ? 3000 : ms);
}
function syncNow(interactive){
  if(!clientId() || !SM.signedIn){ if(interactive) login(false); return Promise.resolve(); }
  if(!tokenOK()){
    if(interactive) login(false);
    else setSyncState('login');
    return Promise.resolve();
  }
  if(!navigator.onLine){ setSyncState('offline'); return Promise.resolve(); }
  if(SYNC.running){ SYNC.again = true; return Promise.resolve(); }
  if(uiBusy()){ syncSoon(4000); return Promise.resolve(); }
  SYNC.running = true; setSyncState('syncing');
  var changedView = false;
  return driveList().then(function(files){
    pullMaker(files);
    var jsons = files.filter(function(x){ return x.name === 'lab-desk.json'; });
    var remote = null, remoteStr = '';
    return jsons.reduce(function(pr, fl){
      return pr.then(function(){ return driveGet(fl.id).then(function(r){ return r.json(); }).then(function(d){
        remote = remote ? Object.assign(mergeDB(remote, d), {}) : d;
      }); });
    }, Promise.resolve()).then(function(){
      if(remote){
        remoteStr = syncPayload(remote);
        if(uiBusy()){ var e = new Error('busy'); e.busy = true; throw e; }
        stampChanges();
        var m = mergeDB(DB, remote);
        if(syncPayload(m) !== syncPayload(DB)){
          SYNC.applying = true;
          DB.projects = m.projects; DB.inventory = m.inventory; DB.designs = m.designs; DB.deleted = m.deleted;
          normalize(DB); rebuildShadow(); save();
          SYNC.applying = false;
          changedView = true;
        }
      }
      return syncFiles(files).then(function(dl){ if(dl) changedView = true; });
    }).then(function(){
      var mine = syncPayload(DB);
      var w;
      if(!jsons.length) w = driveCreate('lab-desk.json', mine, 'application/json');
      else if(mine !== remoteStr || jsons.length > 1) w = driveUpdate(jsons[0].id, mine, 'application/json');
      return Promise.resolve(w).then(function(){
        return Promise.all(jsons.slice(1).map(function(x){ return driveDelete(x.id); }));
      });
    });
  }).then(function(){
    SM.last = Date.now(); saveSM();
    setSyncState('ok');
    if(changedView && !uiBusy()) render(true);
  }).catch(function(e){
    SYNC.applying = false;
    if(e.busy){ syncSoon(4000); setSyncState('ok'); }
    else if(e.status === 401 || e.status === 403){ SM.token = ''; SM.exp = 0; saveSM(); setSyncState('login'); }
    else if(!navigator.onLine) setSyncState('offline');
    else setSyncState('error', e.message || '通信エラー');
  }).then(function(){
    SYNC.running = false;
    if(SYNC.again){ SYNC.again = false; syncSoon(500); }
  });
}
/* 自作デスクの同期ファイル（maker-desk.json）を読んで写しを持つ。読むだけで、失敗しても同期は続ける */
function pullMaker(files){
  var mf = files.filter(function(x){ return x.name === 'maker-desk.json'; })[0];
  if(!mf) return;
  driveGet(mf.id).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !Array.isArray(d.builds)) return;
    var before = MAKER ? MAKER.at : 0;
    try{ localStorage.setItem(MAKER_CACHE, JSON.stringify({ db:slimMaker(d), got:Date.now() })); }catch(e){}
    loadMaker();
    if(MAKER && MAKER.at !== before && !uiBusy()) render(true);
  }).catch(function(){});
}
/* 画像：無いほうへ送る。どの設計図からも使われなくなったものは片づける */
function syncFiles(files){
  var remote = {};
  files.forEach(function(x){ if(x.name.indexOf('f-') === 0) remote[x.name.slice(2)] = x; });
  var need = {};
  DB.designs.forEach(function(d){ if(d.file){ if(d.file.id) need[d.file.id] = 1; if(d.file.thumb) need[d.file.thumb] = 1; } });
  DB.projects.forEach(function(p){ (p.devices || []).forEach(function(d){ (d.sources || []).forEach(function(x){ if(x.fileId) need[x.fileId] = 1; }); }); });
  var downloaded = 0;
  return FILES.keys().then(function(localKeys){
    var local = {}; localKeys.forEach(function(k){ local[k] = 1; });
    var up = Object.keys(need).filter(function(k){ return local[k] && !remote[k]; });
    var down = Object.keys(need).filter(function(k){ return !local[k] && remote[k]; });
    var total = up.length + down.length, done = 0;
    function tick(){ done++; setSyncState('syncing', '画像 ' + done + '/' + total); }
    var chain = Promise.resolve();
    up.forEach(function(k){ chain = chain.then(function(){ return FILES.get(k).then(function(b){ return b ? driveCreate('f-' + k, b, b.type) : null; }).then(tick); }); });
    down.forEach(function(k){ chain = chain.then(function(){ return driveGet(remote[k].id).then(function(r){ return r.blob(); }).then(function(b){ downloaded++; return FILES.put(k, b); }).then(tick); }); });
    return chain.then(function(){
      var dayAgo = Date.now() - 864e5;
      var gcRemote = Object.keys(remote).filter(function(k){ return !need[k] && new Date(remote[k].createdTime).getTime() < dayAgo; });
      var gcLocal = STORING ? [] : localKeys.filter(function(k){ return !need[k]; });
      gcLocal.forEach(function(k){ FILES.del(k).catch(function(){}); if(URLS[k]){ URL.revokeObjectURL(URLS[k]); delete URLS[k]; } });
      return Promise.all(gcRemote.map(function(k){ return driveDelete(remote[k].id); }));
    }).then(function(){ return downloaded; });
  });
}
function syncStartup(){
  if(!SM.signedIn || !clientId()) return;
  if(SYNC.justLoggedIn){
    SYNC.justLoggedIn = false;
    driveAbout().then(function(a){ if(a.user){ SM.email = a.user.emailAddress; SM.name = a.user.displayName; saveSM(); render(true); } }).catch(function(){});
    toast('ログインしました。同期します');
    syncNow(false);
    return;
  }
  if(tokenOK()){ syncNow(false); return; }
  /* トークン切れ：オンラインなら Google に黙って取り直しに行く（10分に1回まで） */
  var last = +(localStorage.getItem('lab-desk-silent') || 0);
  if(navigator.onLine && !SM.needLogin && Date.now() - last > 10 * 60000){
    try{ localStorage.setItem('lab-desk-silent', String(Date.now())); }catch(e){}
    login(true);
  }else setSyncState('login');
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){ var mb = MAKER ? MAKER.at : 0; loadMaker(); if((MAKER ? MAKER.at : 0) !== mb && !uiBusy()) render(true); }
  if(!SM.signedIn) return;
  if(document.visibilityState === 'visible') syncSoon(300);
  else if(tokenOK() && !SYNC.running) syncNow(false);
});
window.addEventListener('online', function(){ syncSoon(500); });
/* 同じブラウザの別タブで自作デスクを編集したら、すぐ反映する */
window.addEventListener('storage', function(e){ if(e.key === MAKER_KEY){ loadMaker(); if(!uiBusy()) render(true); } });

/* ============================================================
   自作実験装置：仕様書と手順書
   p.needsDevice = true の研究に「装置」タブを出す。
   p.devices = [{ id, name, purpose, specs:[{k,v}], parts, tools, safety, notes,
                  steps:[{id,title,body,done}], sources:[{id,name,type,size,fileId,url,importedAt}] }]
   parts / tools は 1 行 1 項目のテキスト。元ファイルは FILES（IndexedDB）に保存して同期する。
   ============================================================ */
var PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
var DOCS_SCOPE = 'https://www.googleapis.com/auth/documents.readonly';

function ptabsOf(p){
  return p.needsDevice ? [PTABS[0], ['device','装置']].concat(PTABS.slice(1)) : PTABS;
}
function getDev(p, id){ return (p.devices || []).find(function(d){ return d.id === id; }); }
function blankDevice(name){
  return { id:uid(), name: name || '自作実験装置', purpose:'', specs:[], parts:'', tools:'', safety:'', notes:'', steps:[], sources:[], createdAt:new Date().toISOString() };
}
function normDevice(d){
  ['specs','steps','sources'].forEach(function(k){ if(!Array.isArray(d[k])) d[k] = []; });
  ['purpose','parts','tools','safety','notes'].forEach(function(k){ if(d[k] == null) d[k] = ''; });
  d.steps.forEach(function(s){ if(!s.id) s.id = uid(); });
}
function lines(t){ return String(t || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function specsToText(specs){ return (specs || []).map(function(s){ return s.k ? s.k + '：' + s.v : s.v; }).join('\n'); }
function textToSpecs(t){
  return lines(t).map(function(l){
    var m = l.match(/^([^:：]{1,30})[:：]\s*(.*)$/);
    return m && !/^https?$/i.test(m[1]) ? { k:m[1].trim(), v:m[2].trim() } : { k:'', v:l };
  });
}

/* ---------- 画面 ---------- */
function tabDevice(p){
  var ds = p.devices || [];
  var h = '<div class="sec"><h2>自作実験装置</h2><span class="sp"></span>' +
    (ds.length ? '<button class="btn sm" data-act="devImport" data-dev="">読み取る</button><button class="btn sm pri" data-act="devNew">' + I.plus + '装置</button>' : '') + '</div>';
  if(!ds.length){
    return h + '<div class="card empty"><div class="big">装置の仕様書と手順書を記録します</div>' +
      '手で入力するか、手元の仕様書・手順書（Word・PDF・テキスト・Google ドキュメント）を読み取って自動で入力できます。' +
      '<div class="btnrow"><button class="btn pri" data-act="devImport" data-dev="">ファイルから読み取る</button><button class="btn" data-act="devNew">手で入力する</button></div></div>';
  }
  return h + ds.map(function(d){ return deviceCard(p, d); }).join('');
}
function deviceCard(p, d){
  normDevice(d);
  var done = d.steps.filter(function(s){ return s.done; }).length, n = d.steps.length;
  var parts = lines(d.parts), tools = lines(d.tools);
  var invMark = function(x){
    var id = matchInv(x.replace(/\s*[×x＊*]\s*\d+.*$/, '').replace(/[（(].*?[)）]/g, ''));
    var it = id && getInv(id);
    return it ? ' <span class="pill ok plain" title="部品リストにあります">手元に ' + num(unusedQty(it)) + esc(it.unit || '個') + '</span>' : '';
  };
  var h = '<div class="card dev"><div class="devhd"><div class="main"><div class="nm">' + esc(d.name || '自作実験装置') + '</div>' +
    (n ? '<div class="pr"><div class="bar' + (done >= n ? ' done' : '') + '"><i style="width:' + Math.round(done / n * 100) + '%"></i></div><span class="mono small">手順 ' + done + '/' + n + '</span></div>' : '') + '</div>' +
    '<button class="btn sm" data-act="devEdit" data-dev="' + d.id + '">' + I.edit + '仕様書</button></div>';

  // 仕様書
  h += '<div class="devsec"><h3>仕様書</h3>';
  h += d.purpose ? '<div class="dblock"><b>目的・用途</b><div class="pre">' + esc(d.purpose) + '</div></div>' : '';
  h += d.specs.length ? '<table class="spec"><tbody>' + d.specs.map(function(s){
    return s.k ? '<tr><th>' + esc(s.k) + '</th><td>' + esc(s.v) + '</td></tr>' : '<tr><td colspan="2">' + esc(s.v) + '</td></tr>';
  }).join('') + '</tbody></table>' : '';
  h += parts.length ? '<div class="dblock"><b>使う部品・材料（' + parts.length + '）</b><ul class="dlist">' + parts.map(function(x){ return '<li>' + esc(x) + invMark(x) + '</li>'; }).join('') + '</ul></div>' : '';
  h += tools.length ? '<div class="dblock"><b>使う工具・機器（' + tools.length + '）</b><ul class="dlist">' + tools.map(function(x){ return '<li>' + esc(x) + invMark(x) + '</li>'; }).join('') + '</ul></div>' : '';
  h += d.safety ? '<div class="dblock warnbox"><b>安全上の注意</b><div class="pre">' + esc(d.safety) + '</div></div>' : '';
  h += d.notes ? '<div class="dblock"><b>備考</b><div class="pre">' + esc(d.notes) + '</div></div>' : '';
  if(!d.purpose && !d.specs.length && !parts.length && !tools.length && !d.safety && !d.notes){
    h += '<div class="muted small" style="padding:4px 0 8px">まだ記入されていません。「仕様書」から入力するか、ファイルを読み取ってください。</div>';
  }
  h += '</div>';

  // 手順書
  h += '<div class="devsec"><div class="devsechd"><h3>手順書</h3><span class="sp"></span><button class="btn sm" data-act="stepNew" data-dev="' + d.id + '">' + I.plus + '手順</button></div>';
  h += n ? '<ol class="steps">' + d.steps.map(function(s, i){
    return '<li class="' + (s.done ? 'done' : '') + '"><button class="chk' + (s.done ? ' on' : '') + '" data-act="stepToggle" data-dev="' + d.id + '" data-step="' + s.id + '" aria-label="できた">' + I.check + '</button>' +
      '<button class="main" data-act="stepEdit" data-dev="' + d.id + '" data-step="' + s.id + '"><span class="no mono">' + (i + 1) + '</span><span class="tx"><span class="t">' + esc(s.title) + '</span>' + (s.body ? '<span class="b">' + esc(s.body) + '</span>' : '') + '</span></button>' +
      '<span class="mv"><button data-act="stepMove" data-dev="' + d.id + '" data-step="' + s.id + '" data-d="-1" aria-label="上へ"' + (i ? '' : ' disabled') + '>↑</button><button data-act="stepMove" data-dev="' + d.id + '" data-step="' + s.id + '" data-d="1" aria-label="下へ"' + (i < n - 1 ? '' : ' disabled') + '>↓</button></span></li>';
  }).join('') + '</ol>' : '<div class="muted small" style="padding:4px 0 8px">手順はまだありません。</div>';
  h += '</div>';

  // 元ファイル
  h += '<div class="devsec"><div class="devsechd"><h3>元の資料</h3><span class="sp"></span><button class="btn sm" data-act="devImport" data-dev="' + d.id + '">読み取る</button></div>';
  h += d.sources.length ? d.sources.map(function(s){
    return '<div class="srcrow"><span class="pill plain">' + esc({ docx:'Word', pdf:'PDF', gdoc:'Google', text:'テキスト', html:'HTML', paste:'貼り付け' }[s.type] || s.type) + '</span>' +
      '<span class="nm">' + esc(s.name) + '</span><span class="mono small faint">' + (s.importedAt ? fmtShort(s.importedAt) : '') + '</span>' +
      (s.fileId || s.url ? '<button class="btn sm ghost" data-act="srcOpen" data-dev="' + d.id + '" data-src="' + s.id + '">開く</button>' : '') +
      '<button class="btn sm ghost" data-act="srcDel" data-dev="' + d.id + '" data-src="' + s.id + '" aria-label="削除">✕</button></div>';
  }).join('') : '<div class="muted small" style="padding:2px 0 6px">読み取った Word・PDF などはここに保存されます。</div>';
  h += '</div>';
  h += '<div class="devft"><button class="btn sm ghost" data-act="devCopy" data-dev="' + d.id + '">' + I.copy + 'テキストでコピー</button></div></div>';
  return h;
}

function deviceForm(p, d){
  var isNew = !d;
  formSheet({
    title: isNew ? '自作実験装置を追加' : '仕様書を編集',
    values: d ? Object.assign({}, d, { specsText: specsToText(d.specs) }) : null,
    fields: [
      { k:'name', label:'装置名', req:true, ph:'例：CO₂ ロガー 試作1号' },
      { k:'purpose', label:'目的・用途', type:'textarea', rows:3, ph:'何を測る・作るための装置か' },
      { k:'specsText', label:'仕様（1行に1つ「項目：値」）', type:'textarea', rows:6, ph:'測定範囲：400〜5000ppm\n電源：USB 5V\n外形：120×80×40mm' },
      { k:'parts', label:'使う部品・材料（1行に1つ）', type:'textarea', rows:4, ph:'ESP32-DevKitC ×1\nSCD41 ×1', hint:'部品リストにあるものは「手元に◯個」と表示されます' },
      { k:'tools', label:'使う工具・機器（1行に1つ）', type:'textarea', rows:3, ph:'はんだごて\nテスター' },
      { k:'safety', label:'安全上の注意', type:'textarea', rows:2 },
      { k:'notes', label:'備考', type:'textarea', rows:2 }
    ],
    onSave: function(v){
      var specs = textToSpecs(v.specsText); delete v.specsText;
      if(!Array.isArray(p.devices)) p.devices = [];
      if(isNew){ d = blankDevice(v.name); p.devices.push(d); }
      Object.assign(d, v, { specs:specs });
      touch(p); save(); render(true);
    },
    onDelete: isNew ? null : function(){
      (d.sources || []).forEach(function(s){ if(s.fileId) dropFile({ id:s.fileId }); });
      p.devices = p.devices.filter(function(x){ return x !== d; });
      touch(p); save(); render(true);
    },
    delLabel: 'この装置を削除', delConfirm: '「' + (d ? d.name : '') + '」の仕様書・手順書・元の資料をすべて削除しますか？'
  });
}
function stepForm(p, d, s){
  var isNew = !s;
  formSheet({
    title: isNew ? '手順を追加' : '手順 ' + (d.steps.indexOf(s) + 1),
    values: s,
    fields: [
      { k:'title', label:'やること', req:true, ph:'例：SCD41 を I2C でつなぐ' },
      { k:'body', label:'詳しい説明・ポイント', type:'textarea', rows:5, ph:'配線、寸法、設定値、注意点 など' },
      { k:'done', label:'できた', type:'check' }

      cur = { text: L.type === 'enumerate' || L.type === 'compactenum' ? L.n + '. ' + rest.trim() : (lab ? lab + '：' : '') + rest.trim() };
      return;
    }
    if(cur){ cur.text += ' ' + t; return; }
    if(/^\\(maketitle|tableofcontents|centering|noindent|clearpage|newpage|caption)\b/.test(t) && !/\\caption/.test(t)) return;
    para.push(t);
  });
  flush();
  return out;
}
/* ほかの形式から読んだブロックに混ざった LaTeX を処理する。段落をまたぐ \begin…\end はまとめて読む */
function latexPrep(blocks){
  var out = [], buf = null, env = '', changed = 0;
  blocks.forEach(function(b){
    if(b.type === 'table'){
      var rows = (b.rows || []).map(function(r){ return r.map(function(c){ var n = latexToText(c); if(n !== c) changed++; return n; }); });
      out.push(Object.assign({}, b, { rows: rows }));
      return;
    }
    var t = String(b.text || '');
    if(buf){
      buf.push(t);
      if(t.indexOf('\\end{' + env + '}') >= 0){ out.push.apply(out, latexBlocks(buf.join('\n'))); changed++; buf = null; }
      return;
    }
    var m = t.match(/\\begin\{([a-zA-Z*]+)\}/);
    if(m && t.indexOf('\\end{' + m[1] + '}') < 0){ buf = [t]; env = m[1]; return; }
    if(m || /^\s*\\(chapter|section|subsection|subsubsection|paragraph|item)\b/.test(t)){
      var lb = latexBlocks(t);
      if(b.type === 'h' && lb.length === 1 && lb[0].type === 'p') lb[0] = { type:'h', level:b.level, text:lb[0].text };
      out.push.apply(out, lb); changed++;
      return;
    }
    var nt = latexToText(t);
    if(nt !== t) changed++;
    out.push(Object.assign({}, b, { text: nt }));
  });
  if(buf){ out.push.apply(out, latexBlocks(buf.join('\n'))); changed++; }
  return { blocks: out, changed: changed };
}
/* 読み取ったブロックを、LaTeX を変換したものと変換しないものの両方で持っておき、確認画面で切り替えられるようにする */
function importAnalyze(pid, devId, raw, name, src, pre){
  var conv = pre ? { blocks: pre, changed: Math.max(1, (raw || []).filter(function(b){ return TEX_HINT.test(b.text || ''); }).length) } : latexPrep(raw);
  UI.impLatex = conv.changed ? { raw: raw, conv: conv.blocks, changed: conv.changed, name: name, on: true } : null;
  importReview(pid, devId, analyzeDoc(conv.changed ? conv.blocks : raw, name), src);
}

  var cnt = function(label, n, list){
    return '<div class="impcnt' + (n ? '' : ' zero') + '"><b>' + label + '</b><span class="mono">' + n + '</span>' + (list && n ? '<div class="pv">' + list.slice(0, 4).map(function(x){ return esc(x); }).join('<br>') + (n > 4 ? '<br>…' : '') + '</div>' : '') + '</div>';
  };
  var total = res.specs.length + res.parts.length + res.tools.length + res.steps.length + res.purpose.length + res.safety.length + res.notes.length;
  openSheet('<h2>読み取り結果の確認</h2>' +

    '<label class="fld"><span>装置名</span><input id="impName" value="' + esc(d && !empty ? d.name : res.name) + '"></label>' +
    '<div class="impgrid">' +
      cnt('目的・用途', res.purpose.length ? 1 : 0, res.purpose.length ? [res.purpose.join(' ').slice(0, 80)] : []) +
      cnt('仕様', res.specs.length, res.specs.map(function(s){ return s.k ? s.k + '：' + s.v : s.v; })) +
      cnt('部品・材料', res.parts.length, res.parts) +
      cnt('工具・機器', res.tools.length, res.tools) +
      cnt('手順', res.steps.length, res.steps.map(function(s, i){ return (i + 1) + '. ' + s.title; })) +
      cnt('安全上の注意', res.safety.length, res.safety) +
      cnt('備考', res.notes.length, res.notes) +
    '</div>' +
    (d && !empty ? '<div class="impmode"><label><input type="radio" name="impMode" value="append" checked> いまの記録に追記する</label><label><input type="radio" name="impMode" value="replace"> いまの記録を置き換える</label></div>' : '') +
    (UI.impLatex ? '<label class="latexnote"><input type="checkbox" data-chg="impLatex"' + (UI.impLatex.on ? ' checked' : '') + '><span><b>LaTeX の記法をふつうの文字に変換する</b>' +
      '<small>資料の中の LaTeX の書き方（数式・単位・表・箇条書きなど）を ' + UI.impLatex.changed + ' か所見つけました。例：$V_{CC}=5\\,\\mathrm{V}$ → V_CC = 5 V、\\SI{3.3}{\\volt} → 3.3 V。外すとコマンドのまま記録します</small></span></label>' : '') +
    '<p class="muted small">記録したあとも、仕様書・手順はそれぞれ編集できます。' + (src.blob ? '元のファイルは装置の「元の資料」に保存されます。' : '') + '</p>' +
    '<div class="formbtns"><span class="sp"></span><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn pri" data-act="impApply"' + (total ? '' : ' disabled') + '>この内容で記録</button></div>');
}
function applyImport(){
  var x = UI.impRes; if(!x) return;
  var p = getP(x.pid); if(!p) return;
  if(!Array.isArray(p.devices)) p.devices = [];
  var res = x.res, d = x.devId ? getDev(p, x.devId) : null;
  var modeEl = document.querySelector('input[name=impMode]:checked'), mode = modeEl ? modeEl.value : 'replace';
  var name = ($('#impName').value || '').trim() || res.name;
  if(!d){ d = blankDevice(name); p.devices.push(d); }
  normDevice(d);
  var join = function(a, b){ return [a, b].filter(Boolean).join('\n'); };
  var uniq = function(a, b){ var seen = {}; return lines(a).concat(b).filter(function(v){ var k = normName(v); if(!k || seen[k]) return false; seen[k] = 1; return true; }).join('\n'); };
  if(mode === 'replace'){
    d.name = name; d.purpose = res.purpose.join('\n'); d.specs = res.specs.slice(); d.parts = res.parts.join('\n'); d.tools = res.tools.join('\n');
    d.safety = res.safety.join('\n'); d.notes = res.notes.join('\n');
    d.steps = res.steps.map(function(s){ return { id:uid(), title:s.title, body:s.body, done:false }; });
  }else{
    d.name = name || d.name;
    d.purpose = join(d.purpose, res.purpose.join('\n'));
    var keys = {}; d.specs.forEach(function(s){ if(s.k) keys[s.k] = 1; });
    d.specs = d.specs.concat(res.specs.filter(function(s){ return !s.k || !keys[s.k]; }));
    d.parts = uniq(d.parts, res.parts); d.tools = uniq(d.tools, res.tools);
    d.safety = join(d.safety, res.safety.join('\n')); d.notes = join(d.notes, res.notes.join('\n'));
    d.steps = d.steps.concat(res.steps.map(function(s){ return { id:uid(), title:s.title, body:s.body, done:false }; }));
  }
  var src = x.src, entry = { id:uid(), name:src.name || '読み取った資料', type:src.type, size:src.size || 0, url:src.url || '', importedAt:todayISO() };
  var finish = function(){
    d.sources.push(entry);
    touch(p); save(); closeSheet();
    if(location.hash !== '#/p/' + p.id + '/device') location.hash = '#/p/' + p.id + '/device'; else render(true);
    toast('「' + d.name + '」に記録しました（仕様 ' + res.specs.length + ' ・ 手順 ' + res.steps.length + '）');
  };
  if(src.blob){
    entry.fileId = uid(); STORING++;
    FILES.put(entry.fileId, src.blob).then(function(){ askPersist(); }).catch(function(){ delete entry.fileId; toast('元のファイルは保存できませんでした（内容は記録します）'); })
      .then(function(){ setTimeout(function(){ STORING = Math.max(0, STORING - 1); }, 15000); finish(); });
  }else finish();
}

/* ---------- Google ドキュメント（Docs API。初回だけ Google のログイン画面へ） ---------- */
function docsTokenOK(){ return !!(SM.docsToken && SM.docsExp && Date.now() < SM.docsExp); }
function importGdoc(pid, devId, url){
  var m = String(url || '').match(/\/document\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]{20,})/) || String(url || '').match(/^([A-Za-z0-9_-]{25,})$/);
  if(!m){ toast('Google ドキュメントの URL を貼り付けてください'); return; }
  if(!clientId()){ toast('Google の設定がありません'); return; }
  if(!docsTokenOK()){
    if(!confirm('Google ドキュメントを読むため、Google のログイン画面に移動します。読み取りの許可（閲覧のみ）を求められたら許可してください。')) return;
    login(false, { scope: DOCS_SCOPE + (SM.signedIn ? ' https://www.googleapis.com/auth/drive.appdata' : ''), purpose:'docs', pending:{ pid:pid, devId:devId || '', url:url } });
    return;
  }
  toast('Google ドキュメントを読み取り中…');
  fetch('https://docs.googleapis.com/v1/documents/' + m[1], { headers:{ Authorization:'Bearer ' + SM.docsToken } }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.ok) return j;
      var msg = (j.error && j.error.message) || '';
      if(r.status === 401){ SM.docsToken = ''; SM.docsExp = 0; saveSM(); throw new Error('ログインの期限が切れました。もう一度「読む」を押してください'); }
      if(r.status === 403 && /has not been used|disabled|SERVICE_DISABLED/i.test(msg + JSON.stringify(j))) throw new Error('Google Cloud で「Google Docs API」が有効になっていません。README の手順で有効にしてください');
      if(r.status === 403 || r.status === 404) throw new Error('ドキュメントが見つからないか、このアカウントに閲覧権限がありません');
      if(r.status === 400) throw new Error('Google ドキュメント形式ではありません（Word のまま Drive に置かれたファイルは、ダウンロードして .docx で読み込んでください）');
      throw new Error('Google ドキュメント ' + r.status + ' ' + msg);
    });
  }).then(function(doc){
    importAnalyze(pid, devId, gdocBlocks(doc), doc.title, { type:'gdoc', name: doc.title || 'Google ドキュメント', url: 'https://docs.google.com/document/d/' + m[1] + '/edit' });
  }).catch(function(e){ alert(e.message || String(e)); });
}

/* doi.org の CSL-JSON。CrossRef の DOI も DataCite（Zenodo など）の DOI も同じ形で返る */
function fetchCSL(doi){
  return fetch('https://doi.org/' + encodeURI(doi), { headers:{ Accept:'application/vnd.citationstyles.csl+json' } })
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(function(m){
      var cjk = /[\u3040-\u30ff\u3400-\u9fff]/;
      var au = (m.author || []).map(function(a){
        if(a.literal) return a.literal;
        var g = a.given || '', f = a.family || '';
        return cjk.test(f + g) ? f + g : (g + ' ' + f).trim();
      }).join(', ');
      var y = (m.issued && m.issued['date-parts'] && m.issued['date-parts'][0] && m.issued['date-parts'][0][0]) || '';
      return {
        name: Array.isArray(m.title) ? m.title[0] : (m.title || ''),
        provider: au || m.publisher || '',
        year: y ? String(y) : '',
        version: m.version || '',
        doi: m.DOI || doi,
        url: m.URL || ''
      };
    });
}

function datasetCite(d){
  if(d.citation) return d.citation;
  var s = (d.provider || '提供元不明') + ' (' + (d.year || 'n.d.') + '). ' + d.name;
  if(d.version) s += ' (' + d.version + ')';
  s += ' [データセット].';
  if(d.doi) s += ' https://doi.org/' + d.doi;
  else if(d.url) s += ' ' + d.url;
  if(d.accessed) s += '（' + fmtDate(d.accessed) + ' 取得）';
  if(d.license) s += ' ライセンス: ' + d.license;
  return s;
}

function isLow(i){ return i.minQty !== '' && i.minQty != null && unusedQty(i) <= +i.minQty; }
function invFiltered(){
  var q = UI.invQuery.toLowerCase().split(/\s+/).filter(Boolean);
  return DB.inventory.filter(function(i){
    if(UI.invCat !== 'すべて' && i.category !== UI.invCat) return false;
    if(UI.invLow && !isLow(i)) return false;
    if(UI.invView === '未使用' && unusedQty(i) <= 0) return false;
    if(UI.invView === '使用中' && inUseQty(i) <= 0) return false;
    if(UI.invView === '使用済み' && usedQty(i) <= 0) return false;
    if(!q.length) return true;
    var hay = [i.name, i.model, i.category, i.location, i.shop, i.note].concat(i.tags || []).join(' ').toLowerCase();
    return q.every(function(w){ return hay.indexOf(w) >= 0; });
  });
}

function parseRoute(){ return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function render(keepScroll){
  var parts = parseRoute(), v = parts[0] || 'home', nav = v, html;
  if(v === 'p'){
    var p = getP(parts[1]);
    if(p && parts[2] === 'datasets') parts[2] = 'refs';
    if(!p){ location.replace('#/'); return; }
    UI.cur = p; html = viewProject(p, parts[2] || 'overview'); nav = 'home';
  }else if(v === 'plan') html = viewPlan();
  else if(v === 'inv') html = viewInv();
  else if(v === 'designs') html = viewDesigns();
  else if(v === 'settings'){ html = viewSettings(); setTimeout(showUsage, 0); }
  else { nav = 'home'; html = viewHome(); }
  var y = window.scrollY;
  $('#view').innerHTML = html;
  document.querySelectorAll('nav.tabs a').forEach(function(a){ a.classList.toggle('on', a.dataset.nav === nav); });
  hydrate($('#view'));
  var segOn = $('.seg a.on');
  if(segOn){ var sg = segOn.parentNode; sg.scrollLeft = segOn.offsetLeft - (sg.clientWidth - segOn.offsetWidth) / 2; }
  if(v === 'inv' && parts[1]){
    var oit = getInv(decodeURIComponent(parts[1]));
    history.replaceState(null, '', '#/inv');
    parts = ['inv'];
    if(oit) setTimeout(function(){ invForm(oit); }, 50);
  }
  if(v === 'inv'){
    $('#invQ').addEventListener('input', function(e){ UI.invQuery = e.target.value; $('#invList').innerHTML = invListHTML(); });
  }
  var key = parts.join('/');
  if(keepScroll) window.scrollTo(0, y);
  else if(key !== UI.lastRoute) window.scrollTo(0, 0);
  UI.lastRoute = key;
}
window.addEventListener('hashchange', function(){ closeSheet(); render(false); });

function applyTheme(){
  var t = DB.settings.theme || 'auto';
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el || !ACT[el.dataset.act]) return;
  if(el.tagName === 'BUTTON' || el.dataset.act !== 'closeSheet') e.preventDefault();
  if(el.tagName === 'A' && el.dataset.act === 'closeSheet'){ closeSheet(); return; }
  ACT[el.dataset.act](el, e);
});
document.addEventListener('change', function(e){
  var k = e.target.dataset.chg;

  else if(k === 'impLatex' && UI.impLatex && UI.impRes){
    UI.impLatex.on = e.target.checked;

document.addEventListener('keydown', function(e){

$('#importFile').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d || !d.v || !Array.isArray(d.projects)) throw new Error('形式が違います');
      if(!confirm('研究 ' + d.projects.length + ' 件・設計図 ' + (d.designs || []).length + ' 件・部品 ' + (d.inventory || []).length + ' 品目を読み込み、いまのデータを置き換えます。よろしいですか？')) return;
      var files = d.files || {};
      toast('読み込み中…');
      FILES.clear().then(function(){
        return Promise.all(Object.keys(files).map(function(k){
          return fetch(files[k]).then(function(r){ return r.blob(); }).then(function(b){ return FILES.put(k, b); });
        }));
      }).then(function(){
        forgetURLs(); DB = normalize(d); save(); applyTheme(); location.hash = '#/'; render(false); toast('読み込みました');
      }).catch(function(){ toast('画像の読み込みに失敗しました'); });
    }catch(err){ toast('読み込めませんでした：' + err.message); }
  };
  rd.readAsText(f);
});

function showUsage(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(function(e){
    var el = $('#usage'); if(el && e.usage != null) el.textContent += ' ・ 画像を含む全体 ' + fmtSize(e.usage);
  }).catch(function(){});
}
function blobToDataURL(b){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(b); });
}
function csv(rows){
  return '﻿' + rows.map(function(r){
    return r.map(function(c){ c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',');
  }).join('\r\n');
}
function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
  }else fallback();
  function fallback(){
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('コピーできませんでした'); }
    t.remove();
  }
}

/* サンプルのブロック図をキャンバスで描いて保存する */
function sampleDesign(p1){
  var c = canvasOf(1400, 900, true), x = c.getContext('2d');
  for(var i = 0; i <= 70; i++){ x.fillStyle = i % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(i * 20, 0, 1, 900); }
  for(var j = 0; j <= 45; j++){ x.fillStyle = j % 5 ? '#E3EAF2' : '#C9D6E4'; x.fillRect(0, j * 20, 1400, 1); }
  var F = '"IBM Plex Sans JP", sans-serif';
  function box(bx, by, w, h, title, sub, col){
    x.fillStyle = '#fff'; x.fillRect(bx, by, w, h);
    x.strokeStyle = col; x.lineWidth = 4; x.strokeRect(bx, by, w, h);
    x.fillStyle = '#1B1F1C'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '700 34px ' + F; x.fillText(title, bx + w / 2, by + h / 2 - (sub ? 18 : 0));
    if(sub){ x.font = '500 22px ' + F; x.fillStyle = '#5F6862'; x.fillText(sub, bx + w / 2, by + h / 2 + 24); }
  }
  function wire(pts, col, label, lx, ly){
    x.strokeStyle = col; x.lineWidth = 4; x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(function(p){ x.lineTo(p[0], p[1]); }); x.stroke();
    if(label){ x.fillStyle = col; x.font = '600 22px ' + F; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(label, lx, ly); }
  }
  x.fillStyle = '#1B1F1C'; x.font = '700 40px ' + F; x.textAlign = 'left'; x.textBaseline = 'top';
  x.fillText('CO₂ロガー　ブロック図（試作1号）', 60, 44);
  wire([[520, 400], [760, 400]], '#2F5B8A', 'I2C  SDA/SCL', 560, 372);
  wire([[640, 400], [640, 250], [760, 250]], '#2F5B8A');
  wire([[640, 400], [640, 560], [760, 560]], '#2F5B8A');
  wire([[340, 720], [340, 490]], '#C62828', 'USB 5V', 356, 610);
